name: Deploy Simple Test Login

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/run-temporary-test-login.txt'
      - '.github/workflows/deploy-temporary-test-login.yml'

concurrency:
  group: sqlagent-simple-login
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  RG: 'rg-babco-rnd-sandbox'
  APP: 'babco-sqlagent-wf-2c606af4'
  LOGIN_URL: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx'

jobs:
  simple-login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Deploy simple login only and keep Entra enabled
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            'deploy-overrides/App_Code/AuthService.cs|App_Code/AuthService.cs' \
            'deploy-overrides/Login.aspx.cs|Login.aspx.cs' \
            'deploy-overrides/Login.aspx|Login.aspx' \
            'deploy-overrides/Admin.aspx.cs|Admin.aspx.cs'; do
            src="${pair%%|*}"; target="${pair##*|}"
            az webapp deploy -g "$RG" -n "$APP" --src-path "$src" --type static --target-path "$target" --restart false --clean false --only-show-errors >/dev/null
          done
          az webapp auth update -g "$RG" -n "$APP" --enabled true --unauthenticated-client-action AllowAnonymous --only-show-errors >/dev/null
          az webapp restart -g "$RG" -n "$APP" --only-show-errors >/dev/null

      - name: Verify Login.aspx is reachable
        shell: bash
        run: |
          set -euo pipefail
          code=0
          for i in $(seq 1 24); do
            code=$(curl -sS -L --max-time 20 -o "$RUNNER_TEMP/live.html" -w '%{http_code}' "$LOGIN_URL" || true)
            [ "$code" = '200' ] && break
            sleep 5
          done
          echo "LOGIN_HTTP=$code"
          [ "$code" = '200' ]
