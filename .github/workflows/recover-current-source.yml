name: Recover Current Source Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-current-source.yml'
      - 'ops/run-current-source-recovery.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  RESOURCE_GROUP: rg-babco-rnd-sandbox
  WEB_APP: babco-sqlagent-wf-2c606af4
  LOGIN_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx

jobs:
  recover:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Build current clean deployment ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $status=Join-Path $env:RUNNER_TEMP 'recovery-status.txt'
          "SOURCE_COMMIT=$env:GITHUB_SHA" | Set-Content $status -Encoding ascii
          $b64=Get-Content (Join-Path $env:GITHUB_WORKSPACE 'source-package\current-source.b64') -Raw
          $zip=Join-Path $env:RUNNER_TEMP 'current-source.zip'
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64.Trim()))
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content $status "SOURCE_ZIP_SHA256=$sha"
          if($sha -ne '99d00cf14da4c30a2b7e787a90e9a4aeb9575136800c64fb1357df9fefd3ac7a'){throw 'Current source hash mismatch.'}
          $root=Join-Path $env:RUNNER_TEMP 'current-source'
          if(Test-Path $root){Remove-Item $root -Recurse -Force}
          Expand-Archive $zip $root -Force
          $site=Join-Path $root 'SQL_AI_Agent'
          if(-not(Test-Path $site)){throw 'SQL_AI_Agent source folder missing.'}
          $overrides=Join-Path $env:GITHUB_WORKSPACE 'deploy-overrides'
          Get-ChildItem $overrides -Recurse -File | ForEach-Object {
            $rel=$_.FullName.Substring($overrides.Length).TrimStart([char[]]@('\','/'))
            $dest=Join-Path $site $rel
            $parent=Split-Path $dest -Parent
            if(-not(Test-Path $parent)){New-Item -ItemType Directory -Path $parent -Force|Out-Null}
            Copy-Item $_.FullName $dest -Force
          }
          foreach($required in @('Login.aspx','Login.aspx.cs','Web.config','App_Code\AgentService.cs','App_Code\OpenAIClient.cs','App_Code\AuthService.cs')){
            if(-not(Test-Path (Join-Path $site $required))){throw "Missing $required"}
          }
          if(Test-Path (Join-Path $site 'App_Code\PricingCalculator.cs')){throw 'Stale PricingCalculator exists in current package.'}
          $deployZip=Join-Path $env:RUNNER_TEMP 'current-deploy.zip'
          if(Test-Path $deployZip){Remove-Item $deployZip -Force}
          Compress-Archive -Path (Join-Path $site '*') -DestinationPath $deployZip -Force
          "DEPLOY_ZIP=$deployZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Add-Content $status 'PACKAGE_VALID=true'

      - name: Direct Kudu deploy current package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $status=Join-Path $env:RUNNER_TEMP 'recovery-status.txt'
          try {
            $profiles=az webapp deployment list-publishing-profiles -g $env:RESOURCE_GROUP -n $env:WEB_APP -o json | ConvertFrom-Json
            $p=@($profiles | Where-Object { $_.publishMethod -eq 'MSDeploy' -or $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1)
            if($p.Count -eq 0){throw 'Publishing profile unavailable.'}
            $u=[string]$p[0].userName;$pw=[string]$p[0].userPWD
            Write-Output "::add-mask::$u";Write-Output "::add-mask::$pw"
            $basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($u+':'+$pw))
            $headers=@{Authorization="Basic $basic"}

            $clean=@'
            $ErrorActionPreference='Continue'
            foreach($d in @('C:\home\site\wwwroot\App_Code','D:\home\site\wwwroot\App_Code')){if(Test-Path $d){Remove-Item $d -Recurse -Force -ErrorAction SilentlyContinue}}
            Write-Output 'APP_CODE_PRE_CLEAN=true'
            '@
            $enc=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($clean))
            $body=@{command="powershell -NoProfile -NonInteractive -EncodedCommand $enc";dir='site\\wwwroot'}|ConvertTo-Json -Compress
            $cleanResult=Invoke-RestMethod -Method Post -Uri "https://$env:WEB_APP.scm.azurewebsites.net/api/command" -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 120
            Add-Content $status 'APP_CODE_PRE_CLEAN=true'

            $deployUri="https://$env:WEB_APP.scm.azurewebsites.net/api/zipdeploy?isAsync=false"
            $response=Invoke-WebRequest -Method Post -Uri $deployUri -Headers $headers -InFile $env:DEPLOY_ZIP -ContentType 'application/zip' -UseBasicParsing -TimeoutSec 600
            Add-Content $status "KUDU_DEPLOY_HTTP=$([int]$response.StatusCode)"
            if([int]$response.StatusCode -lt 200 -or [int]$response.StatusCode -ge 300){throw "Kudu zipdeploy HTTP $([int]$response.StatusCode)"}
            Add-Content $status 'DEPLOY=success'
            az webapp restart -g $env:RESOURCE_GROUP -n $env:WEB_APP --only-show-errors | Out-Null
            Add-Content $status 'RESTART=success'
          } catch {
            Add-Content $status 'DEPLOY=failure'
            Add-Content $status ("DEPLOY_ERROR_TYPE="+$_.Exception.GetType().Name)
            Add-Content $status ("DEPLOY_ERROR="+(($_.Exception.Message) -replace '[\r\n]+',' '))
            throw
          }

      - name: Verify Login and Entra
        if: always()
        shell: pwsh
        run: |
          $status=Join-Path $env:RUNNER_TEMP 'recovery-status.txt'
          if(-not(Test-Path $status)){"SOURCE_COMMIT=$env:GITHUB_SHA"|Set-Content $status -Encoding ascii}
          $loginCode=0
          for($i=1;$i -le 50;$i++){
            try{$r=Invoke-WebRequest -Uri $env:LOGIN_URL -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 20;$loginCode=[int]$r.StatusCode}catch{$loginCode=0}
            if($loginCode -eq 200){break}
            Start-Sleep -Seconds 5
          }
          Add-Content $status "LOGIN_HTTP=$loginCode"
          $entra=0
          try{$r2=Invoke-WebRequest -Uri "https://$env:WEB_APP.azurewebsites.net/.auth/login/aad" -MaximumRedirection 0 -UseBasicParsing -TimeoutSec 25 -ErrorAction Stop;$entra=[int]$r2.StatusCode}catch{try{$entra=[int]$_.Exception.Response.StatusCode}catch{}}
          Add-Content $status "ENTRA_HTTP=$entra"
          if($loginCode -eq 200){Add-Content $status 'SITE_OK=true'}else{Add-Content $status 'SITE_OK=false'}
          Add-Content $status "CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))"

      - name: Publish recovery status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'recovery-publish';New-Item -ItemType Directory -Path $d -Force|Out-Null
          $p=Join-Path $env:RUNNER_TEMP 'recovery-status.txt'
          if(Test-Path $p){Copy-Item $p (Join-Path $d 'status.txt')}else{'RECOVERY_FAILED=true'|Set-Content (Join-Path $d 'status.txt')}
          Push-Location $d;git init|Out-Null;git checkout -b current-source-recovery-status|Out-Null;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add status.txt;git commit -m 'Publish current source recovery status'|Out-Null;git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git";git push --force origin current-source-recovery-status|Out-Null;Pop-Location

      - name: Require live Login
        if: always()
        shell: pwsh
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'recovery-status.txt'
          if(-not((Get-Content $p) -match '^LOGIN_HTTP=200$')){throw 'Login is not HTTP 200.'}
