name: Verify Babco SQL AI Agent Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  LOGIN_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx
  DEFAULT_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Default.aspx
  EASY_AUTH_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Verify live temporary login and Easy Auth
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $s=New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $login=Invoke-WebRequest -Uri $env:LOGIN_URL -WebSession $s -UseBasicParsing -TimeoutSec 30
          if([int]$login.StatusCode -ne 200){throw "Login HTTP $($login.StatusCode)"}
          if($login.Content -notmatch 'Continue Without Microsoft \(Temporary\)'){throw 'Temporary login button missing.'}
          if($login.Content -notmatch 'Azure App Service Easy Auth'){throw 'New Easy Auth source marker missing.'}
          function GetHiddenValue([string]$name,[string]$html){
            $pattern='name="'+[regex]::Escape($name)+'"[^>]*value="([^"]*)"'
            $m=[regex]::Match($html,$pattern,[Text.RegularExpressions.RegexOptions]::IgnoreCase)
            if($m.Success){return [Net.WebUtility]::HtmlDecode($m.Groups[1].Value)}
            return ''
          }
          $body=@{
            '__VIEWSTATE'=(GetHiddenValue '__VIEWSTATE' $login.Content)
            '__VIEWSTATEGENERATOR'=(GetHiddenValue '__VIEWSTATEGENERATOR' $login.Content)
            '__EVENTVALIDATION'=(GetHiddenValue '__EVENTVALIDATION' $login.Content)
            'btnTemporary'='Continue Without Microsoft (Temporary)'
          }
          Invoke-WebRequest -Uri $env:LOGIN_URL -Method Post -Body $body -WebSession $s -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 30 | Out-Null
          $default=Invoke-WebRequest -Uri $env:DEFAULT_URL -WebSession $s -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30
          if([int]$default.StatusCode -ne 200){throw "Default HTTP $($default.StatusCode)"}
          if($default.Content -notmatch 'Babco SQL AI Agent'){throw 'Default.aspx marker missing after temporary login.'}
          $easyStatus=0;$easyLocation=''
          try{
            $easy=Invoke-WebRequest -Uri $env:EASY_AUTH_URL -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30
            $easyStatus=[int]$easy.StatusCode;$easyLocation=[string]$easy.Headers.Location
          }catch{
            if($_.Exception.Response){$easyStatus=[int]$_.Exception.Response.StatusCode;try{$easyLocation=[string]$_.Exception.Response.Headers.Location}catch{}}
          }
          if($easyStatus -lt 300 -or $easyStatus -ge 400){throw "Easy Auth HTTP $easyStatus"}
          @(
            'VERIFIED_LIVE=true',
            'LOGIN_HTTP=200',
            'TEMP_BUTTON=true',
            'TEMP_SESSION=true',
            'DEFAULT_HTTP=200',
            "EASY_AUTH_HTTP=$easyStatus",
            "EASY_AUTH_LOCATION=$easyLocation",
            "LOGIN_URL=$env:LOGIN_URL",
            "DEFAULT_URL=$env:DEFAULT_URL",
            "CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content "$env:RUNNER_TEMP/status.txt" -Encoding ascii

      - name: Publish verification status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'publish';New-Item -ItemType Directory -Path $dir -Force|Out-Null
          $src=Join-Path $env:RUNNER_TEMP 'status.txt'
          if(Test-Path $src){Copy-Item $src (Join-Path $dir 'status.txt')}else{'VERIFIED_LIVE=false'|Set-Content (Join-Path $dir 'status.txt') -Encoding ascii}
          Push-Location $dir
          git init|Out-Null;git checkout -b verification-fixed-status|Out-Null
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt;git commit -m 'Publish verified live status'|Out-Null
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git push --force origin verification-fixed-status|Out-Null
          Pop-Location
