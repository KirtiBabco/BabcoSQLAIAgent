name: Deploy SQL Agent Voice UI

on:
  push:
    branches: [main]
    paths:
      - 'ops/run-sqlagent-voice-ui.txt'
      - '.github/workflows/deploy-sqlagent-voice-ui.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  RG: 'rg-babco-rnd-sandbox'
  APP: 'babco-sqlagent-wf-2c606af4'
  LIVE_URL: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Default.aspx'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate voice controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'webkitSpeechRecognition' Default.aspx
          grep -q 'speechSynthesis' Default.aspx
          grep -q '🎤' Default.aspx
          grep -q '🔊' Default.aspx
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: Deploy Default.aspx only
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy -g "$RG" -n "$APP" --src-path Default.aspx --type static --target-path Default.aspx --restart false --clean false --only-show-errors >/dev/null
          az webapp restart -g "$RG" -n "$APP" --only-show-errors >/dev/null
      - name: Verify live page
        shell: bash
        run: |
          set -euo pipefail
          code=0
          for i in $(seq 1 30); do
            code=$(curl -sS -L --max-time 20 -o "$RUNNER_TEMP/live.html" -w '%{http_code}' "$LIVE_URL" || true)
            if [ "$code" = '200' ] && grep -q 'webkitSpeechRecognition' "$RUNNER_TEMP/live.html" && grep -q 'speechSynthesis' "$RUNNER_TEMP/live.html"; then break; fi
            sleep 5
          done
          echo "LIVE_HTTP=$code"
          [ "$code" = '200' ]
          grep -q 'webkitSpeechRecognition' "$RUNNER_TEMP/live.html"
          grep -q 'speechSynthesis' "$RUNNER_TEMP/live.html"
