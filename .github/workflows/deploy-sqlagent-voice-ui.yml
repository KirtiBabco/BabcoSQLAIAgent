name: Verify Restored SQL Agent UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-sqlagent-voice-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LOGIN_URL: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx'
  ADMIN_URL: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Admin.aspx'

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify full Agent page and Admin Costing without any deployment
        shell: bash
        run: |
          set -euo pipefail
          code=0
          rm -f "$RUNNER_TEMP/cookies"
          for i in $(seq 1 24); do
            code=$(curl -sS -L -c "$RUNNER_TEMP/cookies" -b "$RUNNER_TEMP/cookies" --max-time 20 -o "$RUNNER_TEMP/live.html" -w '%{http_code}' "$LOGIN_URL" || true)
            if [ "$code" = '200' ] && grep -q 'Costing / Admin' "$RUNNER_TEMP/live.html" && grep -q 'ddlLanguage' "$RUNNER_TEMP/live.html" && grep -q 'webkitSpeechRecognition' "$RUNNER_TEMP/live.html" && grep -q 'speechSynthesis' "$RUNNER_TEMP/live.html" && grep -q 'Agent Answer' "$RUNNER_TEMP/live.html"; then break; fi
            sleep 5
          done
          echo "LOGIN_FLOW_HTTP=$code"
          [ "$code" = '200' ]
          grep -q 'Costing / Admin' "$RUNNER_TEMP/live.html"
          grep -q 'ddlLanguage' "$RUNNER_TEMP/live.html"
          grep -q 'webkitSpeechRecognition' "$RUNNER_TEMP/live.html"
          grep -q 'speechSynthesis' "$RUNNER_TEMP/live.html"
          grep -q 'btnClear' "$RUNNER_TEMP/live.html"
          grep -q 'Agent Answer' "$RUNNER_TEMP/live.html"

          admin=0
          for i in $(seq 1 24); do
            admin=$(curl -sS -b "$RUNNER_TEMP/cookies" --max-time 20 -o "$RUNNER_TEMP/admin.html" -w '%{http_code}' "$ADMIN_URL" || true)
            echo "ADMIN_ATTEMPT_${i}=$admin"
            [ "$admin" = '200' ] && break
            sleep 5
          done
          echo "ADMIN_HTTP=$admin"
          [ "$admin" = '200' ]
          grep -q 'Admin Console' "$RUNNER_TEMP/admin.html"
          grep -q 'Costing' "$RUNNER_TEMP/admin.html"
