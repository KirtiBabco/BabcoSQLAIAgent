name: Temporary Azure Federation Bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  IDENTITY_NAME: id-cbp-7501-gha-rnd
  FEDERATED_CREDENTIAL_NAME: fic-kirti-babcosqlaiagent-main
  OIDC_SUBJECT: repo:KirtiBabco@186008200/BabcoSQLAIAgent@1340622048:ref:refs/heads/main
  DEVICE_FLOW_CLIENT_ID: 04b07795-8ddb-461a-bbee-02f9e1bf7b46
  DEVICE_PUBLIC_KEY_DER_B64: 

jobs:
  bootstrap:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Request secure Microsoft device approval and create federation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $dc=Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/${env:AZURE_TENANT_ID}/oauth2/v2.0/devicecode" -ContentType 'application/x-www-form-urlencoded' -Body @{client_id=$env:DEVICE_FLOW_CLIENT_ID;scope='https://management.azure.com/.default offline_access openid profile'}
          Write-Output "::add-mask::$($dc.device_code)"
          Write-Output "::add-mask::$($dc.user_code)"

          $rsa=[Security.Cryptography.RSA]::Create()
          $read=0
          $rsa.ImportSubjectPublicKeyInfo([Convert]::FromBase64String($env:DEVICE_PUBLIC_KEY_DER_B64),[ref]$read)
          $cipher=[Convert]::ToBase64String($rsa.Encrypt([Text.Encoding]::UTF8.GetBytes([string]$dc.user_code),[Security.Cryptography.RSAEncryptionPadding]::OaepSHA256))

          $d=Join-Path $env:RUNNER_TEMP 'device-v3'
          New-Item -ItemType Directory -Path $d -Force|Out-Null
          @(
            'STATE=awaiting_user',
            "RUN_ID=$env:GITHUB_RUN_ID",
            "VERIFICATION_URI=$($dc.verification_uri)",
            "USER_CODE_CIPHERTEXT_B64=$cipher",
            "EXPIRES_IN=$($dc.expires_in)",
            "CREATED_UTC=$([DateTime]::UtcNow.ToString('o'))"
          )|Set-Content (Join-Path $d 'status.txt') -Encoding ascii

          Push-Location $d
          git init|Out-Null
          git checkout -b azure-device-auth-v3|Out-Null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -m 'Publish encrypted Azure device approval code v3'|Out-Null
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git push --force origin azure-device-auth-v3|Out-Null
          Pop-Location

          $token=''
          $interval=[Math]::Max([int]$dc.interval,5)
          $deadline=[DateTime]::UtcNow.AddSeconds([int]$dc.expires_in)
          while([DateTime]::UtcNow -lt $deadline){
            Start-Sleep -Seconds $interval
            try{
              $tr=Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/${env:AZURE_TENANT_ID}/oauth2/v2.0/token" -ContentType 'application/x-www-form-urlencoded' -Body @{grant_type='urn:ietf:params:oauth:grant-type:device_code';client_id=$env:DEVICE_FLOW_CLIENT_ID;device_code=[string]$dc.device_code}
              if($tr.access_token){$token=[string]$tr.access_token;break}
            }catch{
              $e=$null
              try{$e=$_.ErrorDetails.Message|ConvertFrom-Json}catch{}
              if($e.error -eq 'authorization_pending'){continue}
              if($e.error -eq 'slow_down'){$interval+=5;continue}
              if($e.error -eq 'expired_token'){throw 'Device approval expired.'}
              if($e.error -eq 'authorization_declined'){throw 'Device approval declined.'}
              throw
            }
          }
          if(-not $token){throw 'Device approval timed out.'}
          Write-Output "::add-mask::$token"

          $uri="https://management.azure.com/subscriptions/${env:AZURE_SUBSCRIPTION_ID}/resourceGroups/${env:AZURE_RESOURCE_GROUP}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${env:IDENTITY_NAME}/federatedIdentityCredentials/${env:FEDERATED_CREDENTIAL_NAME}?api-version=2024-11-30"
          $body=@{properties=@{issuer='https://token.actions.githubusercontent.com';subject=$env:OIDC_SUBJECT;audiences=@('api://AzureADTokenExchange')}}|ConvertTo-Json -Depth 5
          $r=Invoke-WebRequest -Method Put -Uri $uri -Headers @{Authorization="Bearer $token"} -ContentType 'application/json' -Body $body -SkipHttpErrorCheck
          if([int]$r.StatusCode -lt 200 -or [int]$r.StatusCode -ge 300){throw "Federation create failed HTTP $($r.StatusCode): $([string]$r.Content)"}

          @(
            'STATE=federation_created',
            "SUBJECT=$env:OIDC_SUBJECT",
            'AUDIENCE=api://AzureADTokenExchange',
            "COMPLETED_UTC=$([DateTime]::UtcNow.ToString('o'))"
          )|Set-Content (Join-Path $d 'status.txt') -Encoding ascii
          Push-Location $d
          git add status.txt
          git commit -m 'Record permanent Azure federation v3'|Out-Null
          git push --force origin azure-device-auth-v3|Out-Null
          Pop-Location
