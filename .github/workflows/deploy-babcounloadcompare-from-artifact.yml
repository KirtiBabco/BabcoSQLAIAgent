name: Deploy BabcoUnloadCompare Artifact Safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-babcounloadcompare-from-artifact.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  TARGET_RG: 'rg-babco-rnd-sandbox'
  TARGET_APP: 'app-babco-unloadcompare-0e27b0b7-260818'
  TARGET_URL: 'https://app-babco-unloadcompare-0e27b0b7-260818.azurewebsites.net/UnloadCompare.aspx'
  STD_SWA_NAME: 'babco-followup-capture-demo'
  EXPECTED_SOURCE_COMMIT: '2f8b7352e052133bb351d738330a93fdd9bdcd94'

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Preserve current App Service configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(az webapp show -g "$TARGET_RG" -n "$TARGET_APP" --query name -o tsv --only-show-errors)" = "$TARGET_APP"
          az webapp start -g "$TARGET_RG" -n "$TARGET_APP" --only-show-errors >/dev/null
          az webapp config connection-string list -g "$TARGET_RG" -n "$TARGET_APP" --query '[].name' -o tsv --only-show-errors | sort > "$RUNNER_TEMP/connections-before.txt"
          az webapp config appsettings list -g "$TARGET_RG" -n "$TARGET_APP" --query '[].name' -o tsv --only-show-errors | sort > "$RUNNER_TEMP/appsettings-before.txt"

      - name: Download validated WebForms publish ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/KirtiBabco/BabcoUnloadCompare/deployment-artifacts/build.txt' -o "$RUNNER_TEMP/build.txt"
          grep -Fq "Source commit: $EXPECTED_SOURCE_COMMIT" "$RUNNER_TEMP/build.txt"
          curl -fsSL 'https://raw.githubusercontent.com/KirtiBabco/BabcoUnloadCompare/deployment-artifacts/webapp-publish.zip' -o "$RUNNER_TEMP/webapp-publish.zip"
          unzip -t "$RUNNER_TEMP/webapp-publish.zip" >/dev/null
          for f in Default.aspx UnloadCompare.aspx Site.Master Web.config bin/BabcoUnloadCompare.Web.dll; do unzip -Z1 "$RUNNER_TEMP/webapp-publish.zip" | grep -Fxq "$f"; done
          unzip -p "$RUNNER_TEMP/webapp-publish.zip" Site.Master | grep -Fq 'standard-app-header'
          unzip -p "$RUNNER_TEMP/webapp-publish.zip" Site.Master | grep -Fq 'Without AI'
          unzip -p "$RUNNER_TEMP/webapp-publish.zip" Site.Master | grep -Fq 'This is a prototype and not the final production website.'
          unzip -p "$RUNNER_TEMP/webapp-publish.zip" Site.Master | grep -Fq 'PackingSlip receiving & count'
          unzip -p "$RUNNER_TEMP/webapp-publish.zip" Site.Master | grep -Fq '~/Content/babco-labs-logo.svg'
          if unzip -p "$RUNNER_TEMP/webapp-publish.zip" Site.Master | grep -Fq 'std-brand-fallback'; then echo 'BL fallback still present' >&2; exit 1; fi
          unzip -p "$RUNNER_TEMP/webapp-publish.zip" Site.Master | grep -Fq 'std-user-card'

      - name: Inject canonical STD Policies SVG into deploy package
        shell: bash
        run: |
          set -euo pipefail
          STD_HOST="$(az staticwebapp show -g "$TARGET_RG" -n "$STD_SWA_NAME" --query defaultHostname -o tsv --only-show-errors)"
          test -n "$STD_HOST"
          echo "STD_POLICIES_HOST=$STD_HOST"
          curl -fsSL "https://$STD_HOST/assets/babco-labs-logo.svg" -o "$RUNNER_TEMP/babco-labs-logo.svg"
          test -s "$RUNNER_TEMP/babco-labs-logo.svg"
          grep -Fq '<svg' "$RUNNER_TEMP/babco-labs-logo.svg"
          grep -Fq 'Babco Labs' "$RUNNER_TEMP/babco-labs-logo.svg"

          rm -rf "$RUNNER_TEMP/pkg"
          mkdir -p "$RUNNER_TEMP/pkg/Content"
          unzip -q "$RUNNER_TEMP/webapp-publish.zip" -d "$RUNNER_TEMP/pkg"
          cp "$RUNNER_TEMP/babco-labs-logo.svg" "$RUNNER_TEMP/pkg/Content/babco-labs-logo.svg"
          test -s "$RUNNER_TEMP/pkg/Content/babco-labs-logo.svg"
          grep -Fq '~/Content/babco-labs-logo.svg' "$RUNNER_TEMP/pkg/Site.Master"
          if grep -Fq 'std-brand-fallback' "$RUNNER_TEMP/pkg/Site.Master"; then echo 'BL fallback still present in package' >&2; exit 1; fi

          rm -f "$RUNNER_TEMP/webapp-publish.zip"
          (cd "$RUNNER_TEMP/pkg" && zip -qr "$RUNNER_TEMP/webapp-publish.zip" .)
          unzip -Z1 "$RUNNER_TEMP/webapp-publish.zip" | grep -Fxq 'Content/babco-labs-logo.svg'
          echo "PACKAGE_SHA256=$(sha256sum "$RUNNER_TEMP/webapp-publish.zip" | awk '{print $1}')"
          echo 'LOCAL_STD_SVG_PACKAGED=true'
          echo 'BL_FALLBACK_REMOVED=true'

      - name: Deploy through Azure ARM using OIDC
        shell: bash
        run: |
          set -euo pipefail
          az webapp deploy -g "$TARGET_RG" -n "$TARGET_APP" --src-path "$RUNNER_TEMP/webapp-publish.zip" --type zip --clean false --restart true --only-show-errors
          az webapp restart -g "$TARGET_RG" -n "$TARGET_APP" --only-show-errors >/dev/null
          echo 'ARM_ZIP_DEPLOY_COMPLETED=true'

      - name: Prove settings were not changed
        shell: bash
        run: |
          set -euo pipefail
          az webapp config connection-string list -g "$TARGET_RG" -n "$TARGET_APP" --query '[].name' -o tsv --only-show-errors | sort > "$RUNNER_TEMP/connections-after.txt"
          az webapp config appsettings list -g "$TARGET_RG" -n "$TARGET_APP" --query '[].name' -o tsv --only-show-errors | sort > "$RUNNER_TEMP/appsettings-after.txt"
          diff -u "$RUNNER_TEMP/connections-before.txt" "$RUNNER_TEMP/connections-after.txt"
          diff -u "$RUNNER_TEMP/appsettings-before.txt" "$RUNNER_TEMP/appsettings-after.txt"
          echo 'CONFIG_PRESERVED=true'

      - name: Verify live page, local SVG logo and Entra redirect
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            : > "$RUNNER_TEMP/h"
            code=$(curl -sS --max-time 20 --max-redirs 0 -D "$RUNNER_TEMP/h" -o "$RUNNER_TEMP/b" -w '%{http_code}' "$TARGET_URL" || true)
            loc=$(tr -d '\r' < "$RUNNER_TEMP/h" | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]*:[[:space:]]*/,""); print; exit}')
            echo "SITE_$i HTTP=$code LOCATION=$loc"
            if [ "$code" = '302' ] && printf '%s' "$loc" | grep -Fq '/.auth/login/aad'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = '1'

          logo_ok=0
          logo_url="https://$TARGET_APP.azurewebsites.net/Content/babco-labs-logo.svg"
          for i in $(seq 1 20); do
            lcode=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/live-logo.svg" -w '%{http_code}' "$logo_url" || true)
            echo "LOGO_$i HTTP=$lcode"
            if [ "$lcode" = '200' ] && grep -Fq '<svg' "$RUNNER_TEMP/live-logo.svg" && grep -Fq 'Babco Labs' "$RUNNER_TEMP/live-logo.svg"; then logo_ok=1; break; fi
            sleep 5
          done
          test "$logo_ok" = '1'

          auth_url="https://$TARGET_APP.azurewebsites.net/.auth/login/aad?post_login_redirect_uri=%2FUnloadCompare.aspx"
          auth_ok=0
          for i in $(seq 1 12); do
            : > "$RUNNER_TEMP/ah"
            acode=$(curl -sS --max-time 20 --max-redirs 0 -D "$RUNNER_TEMP/ah" -o "$RUNNER_TEMP/ab" -w '%{http_code}' "$auth_url" || true)
            aloc=$(tr -d '\r' < "$RUNNER_TEMP/ah" | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]*:[[:space:]]*/,""); print; exit}')
            echo "ENTRA_$i HTTP=$acode LOCATION=$aloc"
            if [ "$acode" = '302' ] && printf '%s' "$aloc" | grep -Eqi '^https://login\.(windows\.net|microsoftonline\.com)/'; then auth_ok=1; break; fi
            sleep 5
          done
          test "$auth_ok" = '1'
          echo 'LIVE_PAGE_OK=true'
          echo 'LIVE_LOCAL_SVG_OK=true'
          echo 'BL_FALLBACK_ABSENT=true'
          echo 'ENTRA_OK=true'
          echo 'VERIFIED_URL=https://app-babco-unloadcompare-0e27b0b7-260818.azurewebsites.net/'
