name: Configure and Inspect Babco SQL Network

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-babco-sql-network.yml'
      - 'ops/run-babco-network-inspect.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  RG: rg-babco-rnd-sandbox
  SOURCE_APP: app-babco-unloadcompare-0e27b0b7-260818
  TARGET_APP: babco-sqlagent-wf-2c606af4
  LOCATION: centralindia
  RELAY_NAMESPACE: relay-babco-unloadcompare-0e27b0b7
  HYBRID_CONNECTION_NAME: hc-babco-sql
  SQL_HOST: DESKTOP-RGFJ2N8
  SQL_PORT: '1433'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Create or reuse Relay Hybrid Connection and attach target app
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/network-status.txt"
          echo "SOURCE_COMMIT=$GITHUB_SHA" > "$out"
          az config set extension.use_dynamic_install=yes_without_prompt >/dev/null 2>&1 || true

          if az relay namespace show -g "$RG" -n "$RELAY_NAMESPACE" >/dev/null 2>&1; then
            echo 'RELAY_NAMESPACE=existing' >> "$out"
          else
            if az relay namespace create -g "$RG" -n "$RELAY_NAMESPACE" -l "$LOCATION" >/dev/null 2>&1; then
              echo 'RELAY_NAMESPACE=created' >> "$out"
            else
              echo 'RELAY_NAMESPACE=create_failed' >> "$out"
            fi
          fi

          metadata="[{\"key\":\"endpoint\",\"value\":\"${SQL_HOST}:${SQL_PORT}\"}]"
          if az relay hyco show -g "$RG" --namespace-name "$RELAY_NAMESPACE" -n "$HYBRID_CONNECTION_NAME" >/dev/null 2>&1; then
            az relay hyco update -g "$RG" --namespace-name "$RELAY_NAMESPACE" -n "$HYBRID_CONNECTION_NAME" --requires-client-authorization true --user-metadata "$metadata" >/dev/null 2>&1
            [ $? -eq 0 ] && echo 'HYBRID_RESOURCE=existing_updated' >> "$out" || echo 'HYBRID_RESOURCE=update_failed' >> "$out"
          else
            az relay hyco create -g "$RG" --namespace-name "$RELAY_NAMESPACE" -n "$HYBRID_CONNECTION_NAME" --requires-client-authorization true --user-metadata "$metadata" >/dev/null 2>&1
            [ $? -eq 0 ] && echo 'HYBRID_RESOURCE=created' >> "$out" || echo 'HYBRID_RESOURCE=create_failed' >> "$out"
          fi

          existing=$(az webapp hybrid-connection list -g "$RG" -n "$TARGET_APP" --query "[?name=='$HYBRID_CONNECTION_NAME'] | [0].name" -o tsv --only-show-errors 2>/dev/null)
          if [ -n "$existing" ]; then
            echo 'TARGET_HYBRID_ATTACH=existing' >> "$out"
          else
            az webapp hybrid-connection add -g "$RG" -n "$TARGET_APP" --namespace "$RELAY_NAMESPACE" --hybrid-connection "$HYBRID_CONNECTION_NAME" >/dev/null 2>&1
            [ $? -eq 0 ] && echo 'TARGET_HYBRID_ATTACH=attached' >> "$out" || echo 'TARGET_HYBRID_ATTACH=attach_failed' >> "$out"
          fi
          az webapp restart -g "$RG" -n "$TARGET_APP" --only-show-errors >/dev/null 2>&1 || true

      - name: Inspect safe network metadata
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/network-status.txt"
          [ -f "$out" ] || echo "SOURCE_COMMIT=$GITHUB_SHA" > "$out"
          for app in "$SOURCE_APP" "$TARGET_APP"; do
            prefix="SOURCE"
            [ "$app" = "$TARGET_APP" ] && prefix="TARGET"
            hc=$(az webapp hybrid-connection list -g "$RG" -n "$app" -o json --only-show-errors 2>/dev/null)
            if [ $? -eq 0 ]; then
              count=$(jq 'length' <<< "$hc")
              echo "${prefix}_HYBRID_COUNT=$count" >> "$out"
              jq -r --arg p "$prefix" '.[] | [$p, (.hostname // .hostName // ""), ((.port // "")|tostring), (.serviceBusNamespace // ""), (.hybridConnection // .name // ""), (.relayArmUri // "")] | @tsv' <<< "$hc" | while IFS=$'\t' read -r p host port ns hcname relay; do
                echo "${p}_HYBRID=HOST=${host}|PORT=${port}|NAMESPACE=${ns}|NAME=${hcname}|RELAY=${relay}" >> "$out"
              done
            else
              echo "${prefix}_HYBRID_LIST_ERROR=true" >> "$out"
            fi
          done
          echo "CHECKED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$out"

      - name: Publish safe network status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          d="$RUNNER_TEMP/pub";mkdir -p "$d"
          p="$RUNNER_TEMP/network-status.txt"
          if [ -f "$p" ]; then cp "$p" "$d/status.txt"; else echo 'INSPECT_FAILED=true' > "$d/status.txt"; fi
          cd "$d"
          git init -q;git checkout -q -b babco-network-status
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt;git commit -q -m 'Publish Babco SQL network status'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin babco-network-status >/dev/null
