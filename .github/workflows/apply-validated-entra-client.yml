name: Apply Validated Entra Client To SQL Agent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-validated-entra-client.yml'
      - 'ops/run-apply-validated-entra.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  RG: 'rg-babco-rnd-sandbox'
  TARGET_APP: 'babco-sqlagent-wf-2c606af4'
  SOURCE_APP: 'app-babco-supplierconnect-suhana-rnd'
  VALID_CLIENT_ID: '636abdef-bcb6-407d-9334-c89079f29da8'
  SOURCE_SECRET_SETTING: 'AUTH_CLIENT_SECRET'
  TARGET_SECRET_SETTING: 'SQLAGENT_ENTRA_RECOVERY_SECRET'

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Apply validated Entra provider to target only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $s=Join-Path $env:RUNNER_TEMP 'status.txt'
          "SOURCE_COMMIT=$env:GITHUB_SHA" | Set-Content $s
          'CALLBACK_PREVALIDATED=true' | Add-Content $s
          $secret=az webapp config appsettings list -g $env:RG -n $env:SOURCE_APP --query "[?name=='$($env:SOURCE_SECRET_SETTING)'].value | [0]" -o tsv --only-show-errors
          if([string]::IsNullOrWhiteSpace($secret) -or $secret -eq 'null'){throw 'Source Entra secret unavailable.'}
          Write-Output "::add-mask::$secret"
          $srcRaw=az webapp auth microsoft show -g $env:RG -n $env:SOURCE_APP -o json --only-show-errors
          $src=$srcRaw | ConvertFrom-Json
          $issuer=[string]$src.registration.openIdIssuer
          az webapp config appsettings set -g $env:RG -n $env:TARGET_APP --settings "$($env:TARGET_SECRET_SETTING)=$secret" --only-show-errors | Out-Null
          $args=@('webapp','auth','microsoft','update','-g',$env:RG,'-n',$env:TARGET_APP,'--client-id',$env:VALID_CLIENT_ID,'--client-secret-setting-name',$env:TARGET_SECRET_SETTING,'--yes','--only-show-errors')
          if(-not [string]::IsNullOrWhiteSpace($issuer)){$args += @('--issuer',$issuer)}
          $output=& az @args 2>&1
          if($LASTEXITCODE -ne 0){
            'AUTH_UPDATE=false' | Add-Content $s
            $safe=([string]::Join(' ',@($output))) -replace '[\r\n]+',' '
            if($safe.Length -gt 900){$safe=$safe.Substring(0,900)}
            "AUTH_UPDATE_ERROR=$safe" | Add-Content $s
            throw 'Entra provider update failed.'
          }
          'AUTH_UPDATE=true' | Add-Content $s
          "ACTIVE_CLIENT_ID=$($env:VALID_CLIENT_ID)" | Add-Content $s
          az webapp restart -g $env:RG -n $env:TARGET_APP --only-show-errors | Out-Null

      - name: Verify live Login and Entra challenge
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $s=Join-Path $env:RUNNER_TEMP 'status.txt'
          Start-Sleep -Seconds 15
          $login="https://$($env:TARGET_APP).azurewebsites.net/Login.aspx"
          $loginCode=0
          for($i=1;$i -le 30;$i++){
            try{$r=Invoke-WebRequest -Uri $login -UseBasicParsing -MaximumRedirection 3 -TimeoutSec 15;$loginCode=[int]$r.StatusCode}catch{$loginCode=0}
            if($loginCode -eq 200){break};Start-Sleep -Seconds 3
          }
          "LOGIN_HTTP=$loginCode" | Add-Content $s
          if($loginCode -ne 200){throw 'Login is not healthy.'}
          $auth="https://$($env:TARGET_APP).azurewebsites.net/.auth/login/aad?post_login_redirect_uri=%2FAuthComplete.aspx"
          try{
            $r=Invoke-WebRequest -Uri $auth -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 20 -ErrorAction Stop
            $loc=[string]$r.Headers.Location
            $authCode=[int]$r.StatusCode
          }catch{
            $authCode=0;$loc=''
            try{$authCode=[int]$_.Exception.Response.StatusCode.value__;$loc=[string]$_.Exception.Response.Headers['Location']}catch{}
          }
          "EASY_AUTH_HTTP=$authCode" | Add-Content $s
          if([string]::IsNullOrWhiteSpace($loc) -or $loc -notmatch '^https://login\.microsoftonline\.com/') {throw 'Microsoft challenge not returned.'}
          $ms=Invoke-WebRequest -Uri $loc -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 25 -ErrorAction SilentlyContinue
          $body=[string]$ms.Content
          if($body -match 'AADSTS50011|reply URL specified in the request does not match|redirect URI.*does not match'){
            'AADSTS50011_PRESENT=true' | Add-Content $s
            'VERIFY=failure' | Add-Content $s
            throw 'AADSTS50011 still present.'
          }
          'AADSTS50011_PRESENT=false' | Add-Content $s
          'VERIFY=success' | Add-Content $s
          "LIVE_URL=$login" | Add-Content $s

      - name: Publish final auth status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'pub';New-Item -ItemType Directory -Force -Path $d|Out-Null
          $p=Join-Path $env:RUNNER_TEMP 'status.txt';if(Test-Path $p){Copy-Item $p (Join-Path $d 'status.txt')}else{'RUN_FAILED=true'|Set-Content (Join-Path $d 'status.txt')}
          Add-Content (Join-Path $d 'status.txt') "CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))"
          Push-Location $d;git init -q;git checkout -q -b entra-live-final-status;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add status.txt;git commit -q -m 'Publish final Entra live status';git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git";git push --force origin entra-live-final-status | Out-Null;Pop-Location
