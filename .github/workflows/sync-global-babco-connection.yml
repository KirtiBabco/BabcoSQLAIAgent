name: Sync Global Babco Connection

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-global-babco-connection.yml'
      - 'ops/run-final-live-repair.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  RESOURCE_GROUP: 'rg-babco-rnd-sandbox'
  TARGET_APP: 'babco-sqlagent-wf-2c606af4'
  SOURCE_APP: 'app-babco-unloadcompare-0e27b0b7-260814'
  SOURCE_CONNECTION_NAME: 'BabcoSupportConnectionString'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Apply global Babco connection and repair live App Service
        shell: bash
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/global-babco-status.txt"
          echo "SOURCE_COMMIT=$GITHUB_SHA" > "$status"

          value="$(az webapp config connection-string list -g "$RESOURCE_GROUP" -n "$SOURCE_APP" --query "[?name=='$SOURCE_CONNECTION_NAME'].value | [0]" -o tsv --only-show-errors)"
          if [ -z "$value" ] || [ "$value" = "null" ]; then
            echo "GLOBAL_BABCO_SOURCE_FOUND=false" >> "$status"
            echo "SYNC=failure" >> "$status"
            exit 1
          fi
          echo "::add-mask::$value"

          normalized="$(VALUE="$value" python3 - <<'PY'
import os,re
v=os.environ['VALUE'].strip()
v=re.sub(r'(?i)\bConnectTimeout\s*=', 'Connect Timeout=', v)
v=re.sub(r'(?i)\bConnectionTimeout\s*=', 'Connection Timeout=', v)
v=re.sub(r'(?i)(^|;)\s*Timeout\s*=', r'\1Connect Timeout=', v)
print(v,end='')
PY
)"
          echo "::add-mask::$normalized"
          echo "GLOBAL_BABCO_SOURCE_FOUND=true" >> "$status"
          echo "GLOBAL_BABCO_SOURCE=$SOURCE_APP:$SOURCE_CONNECTION_NAME" >> "$status"
          echo "SQL_KEYWORDS_NORMALIZED=true" >> "$status"

          az webapp config appsettings set -g "$RESOURCE_GROUP" -n "$TARGET_APP" --settings \
            "BAP_SUPPORT_CONNECTION_STRING=$normalized" \
            "SQL_BAP_SUPPORT_CONNECTION_STRING=$normalized" \
            "SQL_CONNECTION_STRING=$normalized" \
            --only-show-errors >/dev/null

          profiles="$(az webapp deployment list-publishing-profiles -g "$RESOURCE_GROUP" -n "$TARGET_APP" -o json --only-show-errors)"
          user="$(jq -r '[.[] | select(.publishMethod=="MSDeploy" or .publishMethod=="ZipDeploy")][0].userName // empty' <<< "$profiles")"
          pass="$(jq -r '[.[] | select(.publishMethod=="MSDeploy" or .publishMethod=="ZipDeploy")][0].userPWD // empty' <<< "$profiles")"
          if [ -z "$user" ] || [ -z "$pass" ]; then
            echo "KUDU_CREDENTIALS=false" >> "$status"
            exit 1
          fi
          echo "::add-mask::$user"
          echo "::add-mask::$pass"
          echo "KUDU_CREDENTIALS=true" >> "$status"

          cmd='$f="D:\home\site\wwwroot\App_Code\PricingCalculator.cs"; if(Test-Path $f){Remove-Item $f -Force; Write-Output "STALE_PRICINGCALCULATOR=removed"} else {Write-Output "STALE_PRICINGCALCULATOR=not_present"}'
          body="$(jq -nc --arg c "powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $cmd" '{command:$c,dir:"site\\wwwroot"}')"
          kudu="https://${TARGET_APP}.scm.azurewebsites.net/api/command"
          cleanup="$(curl -fsS --retry 3 --retry-delay 3 -u "$user:$pass" -H 'Content-Type: application/json' -d "$body" "$kudu")"
          cleanup_out="$(jq -r '.Output // empty' <<< "$cleanup" | tr '\r\n' ' ')"
          if grep -q 'STALE_PRICINGCALCULATOR=removed' <<< "$cleanup_out"; then
            echo "STALE_PRICINGCALCULATOR=removed" >> "$status"
          else
            echo "STALE_PRICINGCALCULATOR=not_present" >> "$status"
          fi

          az webapp restart -g "$RESOURCE_GROUP" -n "$TARGET_APP" --only-show-errors >/dev/null
          echo "SYNC=success" >> "$status"

          login_code=0
          for i in $(seq 1 48); do
            login_code="$(curl -k -L -sS -o "$RUNNER_TEMP/login.html" -w '%{http_code}' --max-time 25 "https://${TARGET_APP}.azurewebsites.net/Login.aspx" || true)"
            if [ "$login_code" = "200" ]; then break; fi
            sleep 5
          done
          echo "LOGIN_HTTP=$login_code" >> "$status"

          entra_code="$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 25 "https://${TARGET_APP}.azurewebsites.net/.auth/login/aad" || true)"
          echo "ENTRA_HTTP=$entra_code" >> "$status"

          sqlcmd='$ErrorActionPreference="Stop"; Add-Type -AssemblyName System.Data; $cs=[Environment]::GetEnvironmentVariable("BAP_SUPPORT_CONNECTION_STRING"); $cs=[regex]::Replace($cs,"(?i)\\bConnectTimeout\\s*=","Connect Timeout="); $cs=[regex]::Replace($cs,"(?i)\\bConnectionTimeout\\s*=","Connection Timeout="); $cs=[regex]::Replace($cs,"(?i)(^|;)\\s*Timeout\\s*=","$1Connect Timeout="); try{$b=New-Object System.Data.SqlClient.SqlConnectionStringBuilder($cs); $b.ConnectTimeout=12; $c=New-Object System.Data.SqlClient.SqlConnection($b.ConnectionString); $c.Open(); $q=$c.CreateCommand(); $q.CommandTimeout=12; $q.CommandText="SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES"; $n=$q.ExecuteScalar(); $c.Close(); Write-Output "SQL_OK=true"; Write-Output "SQL_TABLE_COUNT=$n"; Write-Output ("SQL_SERVER_HOST="+$b.DataSource)}catch{Write-Output "SQL_OK=false"; Write-Output ("SQL_ERROR_TYPE="+$_.Exception.GetType().Name); Write-Output ("SQL_ERROR="+($_.Exception.Message -replace "[\\r\\n]+"," "))}'
          sqlbody="$(jq -nc --arg c "powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $sqlcmd" '{command:$c,dir:"site\\wwwroot"}')"
          sqlres="$(curl -fsS --retry 2 --retry-delay 3 -u "$user:$pass" -H 'Content-Type: application/json' -d "$sqlbody" "$kudu")"
          jq -r '.Output // empty' <<< "$sqlres" | grep -E '^SQL_' >> "$status" || true

          openaicmd='$ErrorActionPreference="Stop"; $k=[Environment]::GetEnvironmentVariable("OPENAI_API_KEY_DEVELOPMENT"); if([string]::IsNullOrWhiteSpace($k)){Write-Output "OPENAI_OK=false";exit}; try{$p=@{model="gpt-5-mini";input="Reply only OK";max_output_tokens=16}|ConvertTo-Json -Compress; $r=Invoke-WebRequest -Method Post -Uri "https://api.openai.com/v1/responses" -Headers @{Authorization=("Bearer "+$k)} -ContentType "application/json" -Body $p -UseBasicParsing -TimeoutSec 30; Write-Output "OPENAI_OK=true"; Write-Output ("OPENAI_HTTP="+[int]$r.StatusCode)}catch{$code=0;try{$code=[int]$_.Exception.Response.StatusCode}catch{};Write-Output "OPENAI_OK=false";Write-Output ("OPENAI_HTTP="+$code)}'
          openaibody="$(jq -nc --arg c "powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $openaicmd" '{command:$c,dir:"site\\wwwroot"}')"
          openaires="$(curl -fsS --retry 2 --retry-delay 3 -u "$user:$pass" -H 'Content-Type: application/json' -d "$openaibody" "$kudu")"
          jq -r '.Output // empty' <<< "$openaires" | grep -E '^OPENAI_' >> "$status" || true

          if [ "$login_code" = "200" ]; then echo "SITE_OK=true" >> "$status"; else echo "SITE_OK=false" >> "$status"; fi
          echo "CHECKED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$status"
          cat "$status"

      - name: Publish safe sync status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          d="$RUNNER_TEMP/global-babco-publish"
          mkdir -p "$d"
          p="$RUNNER_TEMP/global-babco-status.txt"
          if [ -f "$p" ]; then cp "$p" "$d/status.txt"; else echo 'SYNC_RUN_FAILED=true' > "$d/status.txt"; fi
          cd "$d"
          git init -q
          git checkout -q -b global-babco-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -q -m 'Publish final live repair status'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin global-babco-status >/dev/null

      - name: Require live site health
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/global-babco-status.txt"
          grep -q '^LOGIN_HTTP=200$' "$p"
          grep -q '^SITE_OK=true$' "$p"
          grep -q '^SQL_OK=true$' "$p"
          grep -q '^OPENAI_OK=true$' "$p"
