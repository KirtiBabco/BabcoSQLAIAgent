name: Final Live Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-live-verify.yml'
      - 'ops/run-final-live-verify.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  RG: rg-babco-rnd-sandbox
  SOURCE_APP: app-babco-unloadcompare-0e27b0b7-260818
  TARGET_APP: babco-sqlagent-wf-2c606af4

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Mirror working Babco AppSetting to target runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $status=Join-Path $env:RUNNER_TEMP 'final-live-status.txt'
          "SOURCE_COMMIT=$env:GITHUB_SHA"|Set-Content $status -Encoding ascii
          $cs=az webapp config appsettings list -g $env:RG -n $env:SOURCE_APP --query "[?name=='BabcoSupportConnectionString'].value | [0]" -o tsv --only-show-errors
          if([string]::IsNullOrWhiteSpace($cs)-or $cs -eq 'null'){throw 'Working Babco AppSetting not found.'}
          Write-Output "::add-mask::$cs"
          $cs=[regex]::Replace([string]$cs,'(?i)\bConnectTimeout\s*=','Connect Timeout=')
          $cs=[regex]::Replace([string]$cs,'(?i)\bConnectionTimeout\s*=','Connection Timeout=')
          $cs=[regex]::Replace([string]$cs,'(?i)(^|;)\s*Timeout\s*=','$1Connect Timeout=')
          Write-Output "::add-mask::$cs"
          az webapp config appsettings set -g $env:RG -n $env:TARGET_APP --settings "BAP_SUPPORT_CONNECTION_STRING=$cs" "SQL_BAP_SUPPORT_CONNECTION_STRING=$cs" "SQL_CONNECTION_STRING=$cs" --only-show-errors|Out-Null
          Add-Content $status 'BABCO_MIRROR=success'
          az webapp restart -g $env:RG -n $env:TARGET_APP --only-show-errors|Out-Null
          Start-Sleep -Seconds 15

      - name: Run proven SQL health and OpenAI checks through Kudu
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $status=Join-Path $env:RUNNER_TEMP 'final-live-status.txt'
          $profiles=az webapp deployment list-publishing-profiles -g $env:RG -n $env:TARGET_APP -o json|ConvertFrom-Json
          $p=@($profiles|Where-Object {$_.publishMethod -eq 'MSDeploy' -or $_.publishMethod -eq 'ZipDeploy'}|Select-Object -First 1)
          $u=[string]$p[0].userName;$pw=[string]$p[0].userPWD
          Write-Output "::add-mask::$u";Write-Output "::add-mask::$pw"
          $basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($u+':'+$pw))
          $headers=@{Authorization="Basic $basic"}
          $body=@{command='powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File D:\home\site\wwwroot\App_Data\sql-health.ps1';dir='site\wwwroot'}|ConvertTo-Json -Compress
          $r=Invoke-RestMethod -Method Post -Uri "https://$env:TARGET_APP.scm.azurewebsites.net/api/command" -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 120
          $sql=(([string]$r.Output)+"`n"+([string]$r.Error)) -split "`r?`n"|Where-Object {$_ -match '^SQL_'}
          $sql|Add-Content $status
          $openai=@'
          $ErrorActionPreference='Continue'
          $k=[Environment]::GetEnvironmentVariable('OPENAI_API_KEY_DEVELOPMENT')
          try{$payload=@{model='gpt-5-mini';input='Reply only OK';max_output_tokens=16}|ConvertTo-Json -Compress;$x=Invoke-WebRequest -Method Post -Uri 'https://api.openai.com/v1/responses' -Headers @{Authorization=('Bearer '+$k)} -ContentType 'application/json' -Body $payload -UseBasicParsing -TimeoutSec 30;Write-Output 'OPENAI_OK=true';Write-Output ('OPENAI_HTTP='+[int]$x.StatusCode)}catch{Write-Output 'OPENAI_OK=false'}
          '@
          $enc=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($openai))
          $body2=@{command="powershell -NoProfile -EncodedCommand $enc";dir='site\wwwroot'}|ConvertTo-Json -Compress
          $r2=Invoke-RestMethod -Method Post -Uri "https://$env:TARGET_APP.scm.azurewebsites.net/api/command" -Headers $headers -ContentType 'application/json' -Body $body2 -TimeoutSec 120
          (([string]$r2.Output) -split "`r?`n"|Where-Object {$_ -match '^OPENAI_'})|Add-Content $status

      - name: Verify Login and Entra and finalize
        shell: pwsh
        run: |
          $status=Join-Path $env:RUNNER_TEMP 'final-live-status.txt'
          $login=0
          for($i=1;$i -le 30;$i++){try{$r=Invoke-WebRequest -Uri "https://$env:TARGET_APP.azurewebsites.net/Login.aspx" -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 20;$login=[int]$r.StatusCode}catch{$login=0};if($login -eq 200){break};Start-Sleep 5}
          Add-Content $status "LOGIN_HTTP=$login"
          $entra=0
          try{$r=Invoke-WebRequest -Uri "https://$env:TARGET_APP.azurewebsites.net/.auth/login/aad" -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 20 -ErrorAction Stop;$entra=[int]$r.StatusCode}catch{try{$entra=[int]$_.Exception.Response.StatusCode}catch{}}
          Add-Content $status "ENTRA_HTTP=$entra"
          $s=Get-Content $status
          if(($s -match '^SQL_OK=true$') -and ($s -match '^OPENAI_OK=true$') -and ($s -match '^LOGIN_HTTP=200$') -and ($s -match '^ENTRA_HTTP=(302|401)$')){Add-Content $status 'VERIFY=success'}else{Add-Content $status 'VERIFY=failure'}
          Add-Content $status "CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))"

      - name: Publish final live status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'pub';New-Item -ItemType Directory -Path $d -Force|Out-Null
          $p=Join-Path $env:RUNNER_TEMP 'final-live-status.txt';if(Test-Path $p){Copy-Item $p (Join-Path $d 'status.txt')}else{'VERIFY=failure'|Set-Content (Join-Path $d 'status.txt')}
          Push-Location $d;git init|Out-Null;git checkout -b final-live-status|Out-Null;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add status.txt;git commit -m 'Publish final live status'|Out-Null;git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git";git push --force origin final-live-status|Out-Null;Pop-Location

      - name: Require success
        if: always()
        shell: pwsh
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'final-live-status.txt';if(-not((Get-Content $p) -match '^VERIFY=success$')){throw 'Final live verification failed.'}
