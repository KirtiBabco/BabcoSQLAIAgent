name: Bootstrap Existing KVSF Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-existing-kvsf-identity.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  CURRENT_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  KVSF_CLIENT_ID: '651fe941-d9ea-48b4-a339-bf119bc8e9e9'
  KVSF_PRINCIPAL_ID: 'ecee9dc2-bb54-4d86-9c15-6a4c1884497b'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  KVSF_IDENTITY_RG: 'rg-kv-software-factory-dev'
  KVSF_IDENTITY_NAME: 'id-kvsf-github-dev'
  TARGET_RG: 'rg-babco-rnd-sandbox'
  WEB_APP: 'babco-sqlagent-wf-2c606af4'
  CREDENTIAL_NAME: 'github-kirtibabco-babcosqlaiagent-main'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login with current working BabcoSQLAIAgent OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.CURRENT_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Configure identity and inventory permanent SQL network paths
        id: bootstrap
        shell: bash
        run: |
          set +e
          status_file="$RUNNER_TEMP/identity-bootstrap-status.txt"
          : > "$status_file"
          echo "SOURCE_COMMIT=$GITHUB_SHA" >> "$status_file"
          echo "CURRENT_OIDC_LOGIN=success" >> "$status_file"

          if az identity federated-credential show -g "$KVSF_IDENTITY_RG" --identity-name "$KVSF_IDENTITY_NAME" -n "$CREDENTIAL_NAME" >/dev/null 2>&1; then
            echo "KVSF_FEDERATED_CREDENTIAL=already_present" >> "$status_file"
          else
            err="$RUNNER_TEMP/fic.err"
            az identity federated-credential create \
              -g "$KVSF_IDENTITY_RG" \
              --identity-name "$KVSF_IDENTITY_NAME" \
              -n "$CREDENTIAL_NAME" \
              --issuer 'https://token.actions.githubusercontent.com' \
              --subject 'repo:KirtiBabco/BabcoSQLAIAgent:ref:refs/heads/main' \
              --audiences 'api://AzureADTokenExchange' \
              --only-show-errors >/dev/null 2>"$err"
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "KVSF_FEDERATED_CREDENTIAL=created" >> "$status_file"
            else
              echo "KVSF_FEDERATED_CREDENTIAL=failed" >> "$status_file"
              msg=$(tr '\n' ' ' < "$err" | sed -E 's/[[:space:]]+/ /g' | cut -c1-700)
              echo "KVSF_FEDERATED_CREDENTIAL_ERROR=$msg" >> "$status_file"
            fi
          fi

          target_scope="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$TARGET_RG"
          existing=$(az role assignment list --assignee-object-id "$KVSF_PRINCIPAL_ID" --scope "$target_scope" --query "[?roleDefinitionName=='Contributor'] | length(@)" -o tsv 2>/dev/null)
          if [ "$existing" = "1" ]; then
            echo "TARGET_RG_CONTRIBUTOR=already_present" >> "$status_file"
          else
            err="$RUNNER_TEMP/role.err"
            az role assignment create \
              --assignee-object-id "$KVSF_PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --role Contributor \
              --scope "$target_scope" \
              --only-show-errors >/dev/null 2>"$err"
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "TARGET_RG_CONTRIBUTOR=created" >> "$status_file"
            else
              echo "TARGET_RG_CONTRIBUTOR=failed" >> "$status_file"
              msg=$(tr '\n' ' ' < "$err" | sed -E 's/[[:space:]]+/ /g' | cut -c1-700)
              echo "TARGET_RG_CONTRIBUTOR_ERROR=$msg" >> "$status_file"
            fi
          fi

          sql_servers=$(az sql server list --query "[].{rg:resourceGroup,name:name,fqdn:fullyQualifiedDomainName,public:publicNetworkAccess}" -o tsv 2>/dev/null | tr '\n' '|' | cut -c1-3000)
          echo "AZURE_SQL_SERVERS=$sql_servers" >> "$status_file"
          sql_dbs=$(az sql db list --query "[].{rg:resourceGroup,server:serverName,name:name,status:status}" -o tsv 2>/dev/null | tr '\n' '|' | cut -c1-4000)
          echo "AZURE_SQL_DATABASES=$sql_dbs" >> "$status_file"
          vnets=$(az network vnet list --query "[].{rg:resourceGroup,name:name,location:location,prefixes:addressSpace.addressPrefixes}" -o tsv 2>/dev/null | tr '\n' '|' | cut -c1-4000)
          echo "VNETS=$vnets" >> "$status_file"
          gateways=$(az network vnet-gateway list --query "[].{rg:resourceGroup,name:name,type:gatewayType,vpn:vpnType,location:location}" -o tsv 2>/dev/null | tr '\n' '|' | cut -c1-3000)
          echo "VNET_GATEWAYS=$gateways" >> "$status_file"
          localgws=$(az network local-gateway list --query "[].{rg:resourceGroup,name:name,ip:gatewayIpAddress}" -o tsv 2>/dev/null | tr '\n' '|' | cut -c1-3000)
          echo "LOCAL_NETWORK_GATEWAYS=$localgws" >> "$status_file"
          vnetint=$(az webapp vnet-integration list -g "$TARGET_RG" -n "$WEB_APP" --query "[].{vnet:vnetResourceId,routeAll:vnetRouteAllEnabled}" -o tsv 2>/dev/null | tr '\n' '|' | cut -c1-3000)
          echo "APP_VNET_INTEGRATION=$vnetint" >> "$status_file"
          hybrid=$(az webapp hybrid-connection list -g "$TARGET_RG" -n "$WEB_APP" --query "[].{host:hostname,port:port,relay:relayArmUri}" -o tsv 2>/dev/null | tr '\n' '|' | cut -c1-3000)
          echo "APP_HYBRID_CONNECTIONS=$hybrid" >> "$status_file"
          echo "APP_OUTBOUND_IPS=$(az webapp show -g "$TARGET_RG" -n "$WEB_APP" --query possibleOutboundIpAddresses -o tsv 2>/dev/null)" >> "$status_file"

          if grep -q '^KVSF_FEDERATED_CREDENTIAL=\(created\|already_present\)$' "$status_file" && grep -q '^TARGET_RG_CONTRIBUTOR=\(created\|already_present\)$' "$status_file"; then
            echo 'BOOTSTRAP=success' >> "$status_file"
          else
            echo 'BOOTSTRAP=failure' >> "$status_file"
          fi
          echo "CHECKED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$status_file"
          cat "$status_file"

      - name: Publish bootstrap status in this repository
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          d="$RUNNER_TEMP/bootstrap-publish"
          mkdir -p "$d"
          p="$RUNNER_TEMP/identity-bootstrap-status.txt"
          if [ -f "$p" ]; then cp "$p" "$d/status.txt"; else echo 'BOOTSTRAP_RUN_FAILED=true' > "$d/status.txt"; fi
          cd "$d"
          git init -q
          git checkout -q -b identity-bootstrap-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -q -m 'Publish identity bootstrap status'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin identity-bootstrap-status >/dev/null
