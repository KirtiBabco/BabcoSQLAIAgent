name: Bootstrap Azure Federation and Deploy Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-azure-federation-live.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  IDENTITY_NAME: id-cbp-7501-gha-rnd
  FEDERATED_CREDENTIAL_NAME: fic-kirti-babcosqlaiagent-main
  OIDC_SUBJECT: repo:KirtiBabco@186008200/BabcoSQLAIAgent@1340622048:ref:refs/heads/main
  WEB_APP: babco-sqlagent-wf-2c606af4
  LOGIN_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx
  DEFAULT_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Default.aspx
  EASY_AUTH_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad
  DEVICE_FLOW_CLIENT_ID: 04b07795-8ddb-461a-bbee-02f9e1bf7b46
  DEVICE_PUBLIC_KEY_DER_B64: 

jobs:
  bootstrap-deploy-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create full deployment ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'sqlagent-bootstrap-stage'
          $zip = Join-Path $env:RUNNER_TEMP 'sqlagent-bootstrap.zip'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','.github','.deployment','deploy.cmd') } | ForEach-Object {
            Copy-Item $_.FullName $stage -Recurse -Force
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw 'Deployment ZIP was not created.' }
          "DEPLOY_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Try permanent GitHub OIDC login
        id: oidc
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: One-time Owner device authorization and create federation
        id: bootstrap
        if: steps.oidc.outcome != 'success'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deviceEndpoint = "https://login.microsoftonline.com/$env:AZURE_TENANT_ID/oauth2/v2.0/devicecode"
          $tokenEndpoint = "https://login.microsoftonline.com/$env:AZURE_TENANT_ID/oauth2/v2.0/token"
          $dc = Invoke-RestMethod -Method Post -Uri $deviceEndpoint -ContentType 'application/x-www-form-urlencoded' -Body @{
            client_id = $env:DEVICE_FLOW_CLIENT_ID
            scope = 'https://management.azure.com//.default offline_access openid profile'
          }
          if ([string]::IsNullOrWhiteSpace($dc.device_code) -or [string]::IsNullOrWhiteSpace($dc.user_code)) { throw 'Microsoft device authorization did not return a code.' }
          Write-Output "::add-mask::$($dc.device_code)"
          Write-Output "::add-mask::$($dc.user_code)"

          $pub = [Convert]::FromBase64String($env:DEVICE_PUBLIC_KEY_DER_B64)
          $rsa = [System.Security.Cryptography.RSA]::Create()
          $read = 0
          $rsa.ImportSubjectPublicKeyInfo($pub, [ref]$read)
          $cipher = $rsa.Encrypt([Text.Encoding]::UTF8.GetBytes([string]$dc.user_code), [System.Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          $cipherB64 = [Convert]::ToBase64String($cipher)

          $statusDir = Join-Path $env:RUNNER_TEMP 'device-auth-status'
          if (Test-Path $statusDir) { Remove-Item $statusDir -Recurse -Force }
          New-Item -ItemType Directory -Path $statusDir -Force | Out-Null
          @(
            'STATE=awaiting_user',
            "RUN_ID=$env:GITHUB_RUN_ID",
            "VERIFICATION_URI=$($dc.verification_uri)",
            "USER_CODE_CIPHERTEXT_B64=$cipherB64",
            "EXPIRES_IN=$($dc.expires_in)",
            "CREATED_UTC=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -Path (Join-Path $statusDir 'status.txt') -Encoding ascii
          Push-Location $statusDir
          git init | Out-Null
          git checkout -b azure-device-auth | Out-Null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -m 'Publish encrypted Azure device authorization request' | Out-Null
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git push --force origin azure-device-auth | Out-Null
          Pop-Location

          $accessToken = $null
          $interval = [Math]::Max([int]$dc.interval, 5)
          $deadline = [DateTime]::UtcNow.AddSeconds([int]$dc.expires_in)
          while ([DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds $interval
            try {
              $tr = Invoke-RestMethod -Method Post -Uri $tokenEndpoint -ContentType 'application/x-www-form-urlencoded' -Body @{
                grant_type = 'urn:ietf:params:oauth:grant-type:device_code'
                client_id = $env:DEVICE_FLOW_CLIENT_ID
                device_code = [string]$dc.device_code
              }
              if (-not [string]::IsNullOrWhiteSpace($tr.access_token)) {
                $accessToken = [string]$tr.access_token
                break
              }
            } catch {
              $detail = $null
              try { $detail = $_.ErrorDetails.Message | ConvertFrom-Json } catch { }
              if ($detail.error -eq 'slow_down') { $interval += 5; continue }
              if ($detail.error -eq 'authorization_pending') { continue }
              if ($detail.error -eq 'authorization_declined') { throw 'Azure device authorization was declined.' }
              if ($detail.error -eq 'expired_token') { throw 'Azure device authorization expired.' }
              continue
            }
          }
          if ([string]::IsNullOrWhiteSpace($accessToken)) { throw 'Azure device authorization timed out.' }
          Write-Output "::add-mask::$accessToken"

          $ficUri = "https://management.azure.com/subscriptions/$env:AZURE_SUBSCRIPTION_ID/resourceGroups/$env:AZURE_RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities/$env:IDENTITY_NAME/federatedIdentityCredentials/$env:FEDERATED_CREDENTIAL_NAME?api-version=2023-01-31"
          $ficBody = @{
            properties = @{
              issuer = 'https://token.actions.githubusercontent.com'
              subject = $env:OIDC_SUBJECT
              audiences = @('api://AzureADTokenExchange')
            }
          } | ConvertTo-Json -Depth 5
          $ficResponse = Invoke-WebRequest -Method Put -Uri $ficUri -Headers @{ Authorization = "Bearer $accessToken" } -ContentType 'application/json' -Body $ficBody -SkipHttpErrorCheck
          if ([int]$ficResponse.StatusCode -lt 200 -or [int]$ficResponse.StatusCode -ge 300) { throw "Federated credential ARM PUT failed with HTTP $($ficResponse.StatusCode)." }

          @(
            'STATE=federation_created',
            "RUN_ID=$env:GITHUB_RUN_ID",
            "FEDERATED_CREDENTIAL=$env:FEDERATED_CREDENTIAL_NAME",
            "SUBJECT=$env:OIDC_SUBJECT",
            'AUDIENCE=api://AzureADTokenExchange',
            "COMPLETED_UTC=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -Path (Join-Path $statusDir 'status.txt') -Encoding ascii
          Push-Location $statusDir
          git add status.txt
          git commit -m 'Record Azure federation creation' | Out-Null
          git push --force origin azure-device-auth | Out-Null
          Pop-Location

          Start-Sleep -Seconds 12
          $aud = [uri]::EscapeDataString('api://AzureADTokenExchange')
          $sep = if ($env:ACTIONS_ID_TOKEN_REQUEST_URL -match '\?') { '&' } else { '?' }
          $oidcUrl = "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$sep" + "audience=$aud"
          $ghOidc = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -Uri $oidcUrl -Method Get
          if ([string]::IsNullOrWhiteSpace($ghOidc.value)) { throw 'GitHub OIDC token was empty after federation creation.' }
          $loggedIn = $false
          for ($i=1; $i -le 12; $i++) {
            $out = & az login --service-principal --username "$env:AZURE_CLIENT_ID" --tenant "$env:AZURE_TENANT_ID" --federated-token $ghOidc.value --allow-no-subscriptions 2>&1
            if ($LASTEXITCODE -eq 0) { $loggedIn = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $loggedIn) { throw 'Azure OIDC login still failed after creating the federated credential.' }
          az account set --subscription "$env:AZURE_SUBSCRIPTION_ID"
          'BOOTSTRAP_LOGIN=true' | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'bootstrap-login.txt') -Encoding ascii

      - name: Verify target and deploy current source
        id: deploy
        if: steps.oidc.outcome == 'success' || steps.bootstrap.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = az webapp show -g "$env:AZURE_RESOURCE_GROUP" -n "$env:WEB_APP" | ConvertFrom-Json
          if (-not $app.id) { throw 'Azure App Service target is inaccessible.' }
          az webapp start -g "$env:AZURE_RESOURCE_GROUP" -n "$env:WEB_APP" | Out-Null
          az webapp config appsettings set -g "$env:AZURE_RESOURCE_GROUP" -n "$env:WEB_APP" --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false WEBSITE_RUN_FROM_PACKAGE=0 | Out-Null
          az webapp deploy -g "$env:AZURE_RESOURCE_GROUP" -n "$env:WEB_APP" --src-path "$env:DEPLOY_ZIP" --type zip --clean true --restart true | Out-Null
          az webapp restart -g "$env:AZURE_RESOURCE_GROUP" -n "$env:WEB_APP" | Out-Null
          @(
            'TARGET_ACCESS=true',
            'DEPLOYED=true',
            "TARGET_HOST=$($app.defaultHostName)"
          ) | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'deploy-result.txt') -Encoding ascii

      - name: Verify temporary login and Easy Auth live
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 20
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $login = $null
          for ($i=1; $i -le 24; $i++) {
            try {
              $login = Invoke-WebRequest -Uri $env:LOGIN_URL -WebSession $session -UseBasicParsing -TimeoutSec 30
              if ([int]$login.StatusCode -eq 200 -and $login.Content -match 'Continue Without Microsoft \(Temporary\)' -and $login.Content -match 'Azure App Service Easy Auth') { break }
            } catch { }
            Start-Sleep -Seconds 5
          }
          if ($null -eq $login -or [int]$login.StatusCode -ne 200) { throw 'Live Login.aspx did not return HTTP 200.' }
          if ($login.Content -notmatch 'Continue Without Microsoft \(Temporary\)') { throw 'Temporary login button is missing on live site.' }
          if ($login.Content -notmatch 'Azure App Service Easy Auth') { throw 'New source marker is missing on live site.' }

          function Hidden([string]$name, [string]$html) {
            $p = 'name="' + [regex]::Escape($name) + '"[^>]*value="([^"]*)"'
            $m = [regex]::Match($html, $p, [Text.RegularExpressions.RegexOptions]::IgnoreCase)
            if ($m.Success) { return [Net.WebUtility]::HtmlDecode($m.Groups[1].Value) }
            return ''
          }
          $body = @{
            '__VIEWSTATE' = Hidden '__VIEWSTATE' $login.Content
            '__VIEWSTATEGENERATOR' = Hidden '__VIEWSTATEGENERATOR' $login.Content
            '__EVENTVALIDATION' = Hidden '__EVENTVALIDATION' $login.Content
            'btnTemporary' = 'Continue Without Microsoft (Temporary)'
          }
          Invoke-WebRequest -Uri $env:LOGIN_URL -Method Post -Body $body -WebSession $session -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 30 | Out-Null
          $default = Invoke-WebRequest -Uri $env:DEFAULT_URL -WebSession $session -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30
          if ([int]$default.StatusCode -ne 200 -or $default.Content -notmatch 'Babco SQL AI Agent') { throw 'Temporary-session Default.aspx verification failed.' }

          $easyStatus = 0
          $easyLocation = ''
          try {
            $e = Invoke-WebRequest -Uri $env:EASY_AUTH_URL -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30
            $easyStatus = [int]$e.StatusCode
            $easyLocation = [string]$e.Headers.Location
          } catch {
            if ($_.Exception.Response) {
              $easyStatus = [int]$_.Exception.Response.StatusCode
              try { $easyLocation = [string]$_.Exception.Response.Headers.Location } catch { }
            }
          }
          if ($easyStatus -lt 300 -or $easyStatus -ge 400) { throw "Easy Auth endpoint returned HTTP $easyStatus instead of redirect." }
          @(
            'LOGIN_HTTP=200',
            'NEW_SOURCE_LIVE=true',
            'TEMP_BUTTON=true',
            'TEMP_SESSION=true',
            'DEFAULT_HTTP=200',
            "EASY_AUTH_HTTP=$easyStatus",
            'EASY_AUTH_READY=true'
          ) | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'verify-result.txt') -Encoding ascii

      - name: Publish safe bootstrap result
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL_OIDC: ${{ steps.oidc.outcome }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'bootstrap-live-result'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $lines = @(
            "SOURCE_COMMIT=$env:GITHUB_SHA",
            "INITIAL_OIDC=$env:INITIAL_OIDC",
            "BOOTSTRAP=$env:BOOTSTRAP",
            "DEPLOY=$env:DEPLOY",
            "VERIFY=$env:VERIFY"
          )
          foreach ($f in @('bootstrap-login.txt','deploy-result.txt','verify-result.txt')) {
            $p = Join-Path $env:RUNNER_TEMP $f
            if (Test-Path $p) { $lines += Get-Content $p }
          }
          $lines += "LOGIN_URL=$env:LOGIN_URL"
          $lines += "DEFAULT_URL=$env:DEFAULT_URL"
          $lines += "CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))"
          $lines | Set-Content -Path (Join-Path $dir 'status.txt') -Encoding ascii
          Push-Location $dir
          git init | Out-Null
          git checkout -b bootstrap-live-status | Out-Null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -m 'Publish SQL Agent bootstrap live status' | Out-Null
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git push --force origin bootstrap-live-status | Out-Null
          Pop-Location

      - name: Enforce verified live result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.deploy.outcome }}' -ne 'success') { throw 'Azure deployment did not complete.' }
          if ('${{ steps.verify.outcome }}' -ne 'success') { throw 'Live end-to-end verification did not complete.' }
