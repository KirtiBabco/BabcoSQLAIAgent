name: Find Working BAP SQL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/find-working-bap-sql.yml'
      - 'ops/run-bap-sql-scan.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Scan existing App Services for safe Babco SQL metadata
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/bap-sql-scan.txt"
          : > "$out"
          echo "SOURCE_COMMIT=$GITHUB_SHA" >> "$out"
          apps=$(az webapp list --query "[].{name:name,rg:resourceGroup}" -o tsv 2>/dev/null)
          while IFS=$'\t' read -r app rg; do
            [ -z "$app" ] && continue
            aset=$(az webapp config appsettings list -g "$rg" -n "$app" -o json 2>/dev/null)
            cset=$(az webapp config connection-string list -g "$rg" -n "$app" -o json 2>/dev/null)
            VALUES_JSON="$(python3 - <<'PY' "$aset" "$cset"
import json,sys
keys={'BAP_SUPPORT_CONNECTION_STRING','SQL_BAP_SUPPORT_CONNECTION_STRING','SQL_CONNECTION_STRING','BABCOSUPPORTCONNECTIONSTRING','CONNECTIONSTRING','BABCOSUPPORTCONNECTIONSTRING'}
out=[]
for kind,raw in [('APPSETTING',sys.argv[1]),('CONNECTION',sys.argv[2])]:
    try:a=json.loads(raw or '[]')
    except:a=[]
    for x in a:
        n=str(x.get('name',''))
        if n.upper() in keys:
            v=str(x.get('value',''))
            if v: out.append({'kind':kind,'name':n,'value':v})
print(json.dumps(out))
PY
)"
            count=$(jq 'length' <<< "$VALUES_JSON" 2>/dev/null)
            [ "${count:-0}" -eq 0 ] && continue
            for idx in $(seq 0 $((count-1))); do
              kind=$(jq -r ".[$idx].kind" <<< "$VALUES_JSON")
              name=$(jq -r ".[$idx].name" <<< "$VALUES_JSON")
              value=$(jq -r ".[$idx].value" <<< "$VALUES_JSON")
              safe=$(VALUE="$value" python3 - <<'PY'
import os,re
v=os.environ.get('VALUE','').strip().strip('"').strip("'")
v=re.sub(r'(?i)\bConnectTimeout\s*=', 'Connect Timeout=', v)
parts={}
for p in v.split(';'):
    if '=' in p:
        k,val=p.split('=',1);parts[k.strip().lower().replace(' ','')]=val.strip()
host=parts.get('datasource') or parts.get('server') or parts.get('address') or parts.get('addr') or parts.get('networkaddress') or ''
db=parts.get('initialcatalog') or parts.get('database') or ''
hostclean=host.lower().replace('tcp:','').split(',')[0].split('\\')[0]
kind='AZURE_SQL' if hostclean.endswith('.database.windows.net') else 'SQL_SERVER'
print(f"HOST={host}|DB={db}|SERVER_KIND={kind}")
PY
)
              echo "APP=$app|RG=$rg|SOURCE_KIND=$kind|KEY=$name|$safe" >> "$out"
            done
          done <<< "$apps"
          echo "CHECKED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$out"
          cat "$out"

      - name: Publish safe scan status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          d="$RUNNER_TEMP/publish"; mkdir -p "$d"
          p="$RUNNER_TEMP/bap-sql-scan.txt"
          if [ -f "$p" ]; then cp "$p" "$d/status.txt"; else echo 'SCAN_FAILED=true' > "$d/status.txt"; fi
          cd "$d"
          git init -q
          git checkout -q -b bap-sql-scan-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -q -m 'Publish safe BAP SQL scan'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin bap-sql-scan-status >/dev/null
