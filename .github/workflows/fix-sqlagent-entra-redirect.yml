name: Fix SQL Agent Entra Redirect URI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sqlagent-entra-redirect.yml'
      - 'ops/run-fix-entra-redirect.txt'

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  ENTRA_APP_CLIENT_ID: '0a49493a-7199-490d-9416-59ea6199861f'
  TARGET_APP: 'babco-sqlagent-wf-2c606af4'
  TARGET_CALLBACK: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad/callback'
  TARGET_LOGIN: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx'

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Add missing SQL Agent callback without removing existing URIs
        shell: bash
        run: |
          set -euo pipefail
          s="$RUNNER_TEMP/entra-redirect-status.txt"
          echo "CLIENT_ID=$ENTRA_APP_CLIENT_ID" > "$s"
          echo "TARGET_CALLBACK=$TARGET_CALLBACK" >> "$s"
          echo 'SQL_SETTINGS_WRITTEN=false' >> "$s"
          echo 'OPENAI_SETTINGS_WRITTEN=false' >> "$s"
          echo 'APP_SERVICE_AUTH_SETTINGS_WRITTEN=false' >> "$s"

          az ad app show --id "$ENTRA_APP_CLIENT_ID" -o json > "$RUNNER_TEMP/app-before.json"
          mapfile -t uris < <(jq -r '.web.redirectUris[]? // empty' "$RUNNER_TEMP/app-before.json")
          printf '%s\n' "${uris[@]}" > "$RUNNER_TEMP/redirects-before.txt"
          echo "REDIRECT_COUNT_BEFORE=${#uris[@]}" >> "$s"

          present=false
          for u in "${uris[@]}"; do
            if [ "$u" = "$TARGET_CALLBACK" ]; then present=true; fi
          done

          if [ "$present" = false ]; then
            merged=("${uris[@]}" "$TARGET_CALLBACK")
            az ad app update --id "$ENTRA_APP_CLIENT_ID" --web-redirect-uris "${merged[@]}" --only-show-errors >/dev/null
            echo 'REDIRECT_ADDED=true' >> "$s"
          else
            echo 'REDIRECT_ADDED=already-present' >> "$s"
          fi

          az ad app show --id "$ENTRA_APP_CLIENT_ID" -o json > "$RUNNER_TEMP/app-after.json"
          jq -e --arg cb "$TARGET_CALLBACK" '.web.redirectUris | index($cb) != null' "$RUNNER_TEMP/app-after.json" >/dev/null
          after=$(jq -r '.web.redirectUris | length' "$RUNNER_TEMP/app-after.json")
          echo "REDIRECT_COUNT_AFTER=$after" >> "$s"
          echo 'TARGET_CALLBACK_REGISTERED=true' >> "$s"

      - name: Verify live Entra entry point
        shell: bash
        run: |
          set -euo pipefail
          s="$RUNNER_TEMP/entra-redirect-status.txt"
          login=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/login.html" -w '%{http_code}' "$TARGET_LOGIN" || true)
          echo "LOGIN_HTTP=$login" >> "$s"
          [ "$login" = '200' ]

          aad=$(curl -sS --max-time 20 -D "$RUNNER_TEMP/aad.headers" -o /dev/null -w '%{http_code}' "https://$TARGET_APP.azurewebsites.net/.auth/login/aad?post_login_redirect_uri=%2FAuthComplete.aspx" || true)
          echo "ENTRA_ENTRY_HTTP=$aad" >> "$s"
          [ "$aad" = '302' ] || [ "$aad" = '303' ]
          grep -Eqi '^location: .*microsoftonline' "$RUNNER_TEMP/aad.headers"
          echo 'ENTRA_CHALLENGE=true' >> "$s"
          echo 'VERIFY=success' >> "$s"

      - name: Publish redirect fix status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          d="$RUNNER_TEMP/pub"; mkdir -p "$d"
          p="$RUNNER_TEMP/entra-redirect-status.txt"
          if [ -f "$p" ]; then cp "$p" "$d/status.txt"; else echo 'RUN_FAILED=true' > "$d/status.txt"; fi
          echo "CHECKED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$d/status.txt"
          cd "$d"
          git init -q
          git checkout -q -b entra-redirect-fix-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -q -m 'Publish Entra redirect fix status'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin entra-redirect-fix-status >/dev/null
