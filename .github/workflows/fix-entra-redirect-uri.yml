name: Fix Entra Redirect URI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-entra-redirect-uri.yml'
      - 'ops/run-fix-entra-redirect.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  ENTRA_PROVISIONER_CLIENT_ID: 'a6dd8ea2-628c-45bf-a861-8e19df7732da'
  TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  APP: 'babco-sqlagent-wf-2c606af4'
  ENTRA_APP_CLIENT_ID: '0a49493a-7199-490d-9416-59ea6199861f'
  REQUIRED_REDIRECT_URI: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad/callback'
  LOGIN_URL: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx'

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Login with verified CAP-047 Entra provisioner
        uses: azure/login@v2
        with:
          client-id: ${{ env.ENTRA_PROVISIONER_CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Add missing callback while preserving every existing redirect URI
        shell: bash
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/entra-redirect-status.txt"
          echo "SOURCE_COMMIT=$GITHUB_SHA" > "$status"
          echo "AUTH_CLIENT_ID=$ENTRA_APP_CLIENT_ID" >> "$status"
          echo "REQUIRED_REDIRECT_URI=$REQUIRED_REDIRECT_URI" >> "$status"
          echo 'SQL_SETTINGS_WRITTEN=false' >> "$status"
          echo 'OPENAI_SETTINGS_WRITTEN=false' >> "$status"
          echo 'APP_SERVICE_AUTH_SETTINGS_WRITTEN=false' >> "$status"
          echo 'CAP047_PROVISIONER_USED=true' >> "$status"

          token="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          echo "::add-mask::$token"
          query="https://graph.microsoft.com/v1.0/applications?%24filter=appId%20eq%20%27${ENTRA_APP_CLIENT_ID}%27&%24select=id,appId,displayName,web"
          rcode="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/app-before.json" -w '%{http_code}' -H "Authorization: Bearer $token" "$query")"
          echo "GRAPH_READ_HTTP=$rcode" >> "$status"
          test "$rcode" = '200'
          test "$(jq -r '.value | length' "$RUNNER_TEMP/app-before.json")" = '1'
          object_id="$(jq -r '.value[0].id' "$RUNNER_TEMP/app-before.json")"
          before="$(jq -r '.value[0].web.redirectUris // [] | length' "$RUNNER_TEMP/app-before.json")"
          echo "REDIRECT_COUNT_BEFORE=$before" >> "$status"

          if jq -e --arg u "$REQUIRED_REDIRECT_URI" '(.value[0].web.redirectUris // []) | index($u) != null' "$RUNNER_TEMP/app-before.json" >/dev/null; then
            echo 'REDIRECT_ADDED=already-present' >> "$status"
          else
            body="$(jq -c --arg u "$REQUIRED_REDIRECT_URI" '{web:{redirectUris:(((.value[0].web.redirectUris // []) + [$u]) | unique)}}' "$RUNNER_TEMP/app-before.json")"
            pcode="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/patch.txt" -w '%{http_code}' -X PATCH -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d "$body" "https://graph.microsoft.com/v1.0/applications/$object_id")"
            echo "GRAPH_PATCH_HTTP=$pcode" >> "$status"
            test "$pcode" = '204'
            echo 'REDIRECT_ADDED=true' >> "$status"
          fi

          sleep 5
          vcode="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/app-after.json" -w '%{http_code}' -H "Authorization: Bearer $token" "$query")"
          echo "GRAPH_VERIFY_HTTP=$vcode" >> "$status"
          test "$vcode" = '200'
          jq -e --arg u "$REQUIRED_REDIRECT_URI" '(.value[0].web.redirectUris // []) | index($u) != null' "$RUNNER_TEMP/app-after.json" >/dev/null
          after="$(jq -r '.value[0].web.redirectUris // [] | length' "$RUNNER_TEMP/app-after.json")"
          echo "REDIRECT_COUNT_AFTER=$after" >> "$status"
          echo 'TARGET_CALLBACK_REGISTERED=true' >> "$status"
          echo 'GRAPH_VERIFY=true' >> "$status"

      - name: Verify live Easy Auth challenge after directory repair
        shell: bash
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/entra-redirect-status.txt"
          login="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/login.html" -w '%{http_code}' "$LOGIN_URL" || true)"
          echo "LOGIN_HTTP=$login" >> "$status"
          test "$login" = '200'
          grep -q 'Sign in with Microsoft Entra ID' "$RUNNER_TEMP/login.html"
          auth_url="https://$APP.azurewebsites.net/.auth/login/aad?post_login_redirect_uri=%2FAuthComplete.aspx"
          aad="$(curl -sS --max-time 20 --max-redirs 0 -D "$RUNNER_TEMP/aad.headers" -o /dev/null -w '%{http_code}' "$auth_url" || true)"
          echo "ENTRA_ENTRY_HTTP=$aad" >> "$status"
          test "$aad" = '302' -o "$aad" = '303'
          grep -Eqi '^location: .*microsoftonline' "$RUNNER_TEMP/aad.headers"
          echo 'ENTRA_CHALLENGE=true' >> "$status"
          echo 'AADSTS50011_ROOT_CAUSE_REPAIRED=true' >> "$status"
          echo 'VERIFY=success' >> "$status"
          echo "CHECKED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$status"

      - name: Publish safe status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          d="$RUNNER_TEMP/pub"; mkdir -p "$d"
          p="$RUNNER_TEMP/entra-redirect-status.txt"
          if [ -f "$p" ]; then cp "$p" "$d/status.txt"; else echo 'RUN_FAILED=true' > "$d/status.txt"; fi
          cd "$d"
          git init -q
          git checkout -q -b entra-redirect-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -q -m 'Publish Entra redirect repair status'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin entra-redirect-status >/dev/null
