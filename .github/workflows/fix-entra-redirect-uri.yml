name: Fix Entra Redirect URI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-entra-redirect-uri.yml'
      - 'ops/run-fix-entra-redirect.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  ENTRA_APP_CLIENT_ID: '0a49493a-7199-490d-9416-59ea6199861f'
  REQUIRED_REDIRECT_URI: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad/callback'

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Preserve existing redirect URIs and add required callback
        shell: bash
        run: |
          set +e
          status="$RUNNER_TEMP/entra-redirect-status.txt"
          echo "SOURCE_COMMIT=$GITHUB_SHA" > "$status"
          current=$(az ad app show --id "$ENTRA_APP_CLIENT_ID" --query 'web.redirectUris' -o json 2>"$RUNNER_TEMP/azerr.txt")
          rc=$?
          if [ $rc -ne 0 ] || [ -z "$current" ]; then
            echo 'APP_READ=false' >> "$status"
            echo 'UPDATE=false' >> "$status"
            echo "ERROR=$(tr '\n' ' ' < "$RUNNER_TEMP/azerr.txt" | sed 's/[[:space:]]\+/ /g')" >> "$status"
            exit 1
          fi
          echo 'APP_READ=true' >> "$status"
          merged=$(jq -c --arg uri "$REQUIRED_REDIRECT_URI" '(. + [$uri]) | unique' <<< "$current")
          mapfile -t uris < <(jq -r '.[]' <<< "$merged")
          az ad app update --id "$ENTRA_APP_CLIENT_ID" --web-redirect-uris "${uris[@]}" 2>"$RUNNER_TEMP/updateerr.txt"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo 'UPDATE=false' >> "$status"
            echo "ERROR=$(tr '\n' ' ' < "$RUNNER_TEMP/updateerr.txt" | sed 's/[[:space:]]\+/ /g')" >> "$status"
            exit 1
          fi
          echo 'UPDATE=true' >> "$status"
          verify=$(az ad app show --id "$ENTRA_APP_CLIENT_ID" --query 'web.redirectUris' -o json 2>/dev/null)
          if jq -e --arg uri "$REQUIRED_REDIRECT_URI" 'index($uri) != null' <<< "$verify" >/dev/null; then
            echo 'REDIRECT_PRESENT=true' >> "$status"
          else
            echo 'REDIRECT_PRESENT=false' >> "$status"
            exit 1
          fi
          echo "CHECKED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$status"

      - name: Publish safe status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          d="$RUNNER_TEMP/pub"; mkdir -p "$d"
          p="$RUNNER_TEMP/entra-redirect-status.txt"
          if [ -f "$p" ]; then cp "$p" "$d/status.txt"; else echo 'RUN_FAILED=true' > "$d/status.txt"; fi
          cd "$d"
          git init -q
          git checkout -q -b entra-redirect-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -q -m 'Publish Entra redirect fix status'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin entra-redirect-status >/dev/null
