name: Final Clean Deploy Babco SQL AI Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  IDENTITY_NAME: id-cbp-7501-gha-rnd
  FEDERATED_CREDENTIAL_NAME: fic-kirti-babcosqlaiagent-main
  OIDC_SUBJECT: repo:KirtiBabco@186008200/BabcoSQLAIAgent@1340622048:ref:refs/heads/main
  WEB_APP: babco-sqlagent-wf-2c606af4
  LOGIN_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx
  DEFAULT_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Default.aspx
  EASY_AUTH_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad
  DEVICE_FLOW_CLIENT_ID: 04b07795-8ddb-461a-bbee-02f9e1bf7b46
  DEVICE_PUBLIC_KEY_DER_B64: 

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'stage'; $zip=Join-Path $env:RUNNER_TEMP 'site.zip'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}; if(Test-Path $zip){Remove-Item $zip -Force}
          New-Item -ItemType Directory -Path $stage -Force|Out-Null
          Get-ChildItem -Force|Where-Object{$_.Name -notin @('.git','.github','.deployment','deploy.cmd')}|ForEach-Object{Copy-Item $_.FullName $stage -Recurse -Force}
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          "DEPLOY_ZIP=$zip"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Try permanent OIDC
        id: oidc
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Bootstrap federation once
        id: bootstrap
        if: steps.oidc.outcome != 'success'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $deviceUri="https://login.microsoftonline.com/${env:AZURE_TENANT_ID}/oauth2/v2.0/devicecode"
          $tokenUri="https://login.microsoftonline.com/${env:AZURE_TENANT_ID}/oauth2/v2.0/token"
          $dc=Invoke-RestMethod -Method Post -Uri $deviceUri -ContentType 'application/x-www-form-urlencoded' -Body @{client_id=$env:DEVICE_FLOW_CLIENT_ID;scope='https://management.azure.com/.default offline_access openid profile'}
          Write-Output "::add-mask::$($dc.device_code)"; Write-Output "::add-mask::$($dc.user_code)"
          $rsa=[Security.Cryptography.RSA]::Create(); $read=0; $rsa.ImportSubjectPublicKeyInfo([Convert]::FromBase64String($env:DEVICE_PUBLIC_KEY_DER_B64),[ref]$read)
          $cipher=[Convert]::ToBase64String($rsa.Encrypt([Text.Encoding]::UTF8.GetBytes([string]$dc.user_code),[Security.Cryptography.RSAEncryptionPadding]::OaepSHA256))
          $d=Join-Path $env:RUNNER_TEMP 'device'; New-Item -ItemType Directory -Path $d -Force|Out-Null
          @('STATE=awaiting_user',"RUN_ID=$env:GITHUB_RUN_ID","VERIFICATION_URI=$($dc.verification_uri)","USER_CODE_CIPHERTEXT_B64=$cipher","EXPIRES_IN=$($dc.expires_in)","CREATED_UTC=$([DateTime]::UtcNow.ToString('o'))")|Set-Content (Join-Path $d 'status.txt') -Encoding ascii
          Push-Location $d; git init|Out-Null; git checkout -b azure-device-auth-final|Out-Null; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add status.txt; git commit -m 'Publish encrypted Azure approval code'|Out-Null; git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"; git push --force origin azure-device-auth-final|Out-Null; Pop-Location
          $token=''; $interval=[Math]::Max([int]$dc.interval,5); $deadline=[DateTime]::UtcNow.AddSeconds([int]$dc.expires_in)
          while([DateTime]::UtcNow -lt $deadline){Start-Sleep -Seconds $interval;try{$tr=Invoke-RestMethod -Method Post -Uri $tokenUri -ContentType 'application/x-www-form-urlencoded' -Body @{grant_type='urn:ietf:params:oauth:grant-type:device_code';client_id=$env:DEVICE_FLOW_CLIENT_ID;device_code=[string]$dc.device_code};if($tr.access_token){$token=[string]$tr.access_token;break}}catch{$e=$null;try{$e=$_.ErrorDetails.Message|ConvertFrom-Json}catch{};if($e.error -eq 'authorization_pending'){continue};if($e.error -eq 'slow_down'){$interval+=5;continue};if($e.error -eq 'expired_token'){throw 'Device approval expired.'};if($e.error -eq 'authorization_declined'){throw 'Device approval declined.'}}}
          if(-not $token){throw 'Device approval timed out.'}; Write-Output "::add-mask::$token"
          $ficUri="https://management.azure.com/subscriptions/${env:AZURE_SUBSCRIPTION_ID}/resourceGroups/${env:AZURE_RESOURCE_GROUP}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${env:IDENTITY_NAME}/federatedIdentityCredentials/${env:FEDERATED_CREDENTIAL_NAME}?api-version=2024-11-30"
          $ficBody=@{properties=@{issuer='https://token.actions.githubusercontent.com';subject=$env:OIDC_SUBJECT;audiences=@('api://AzureADTokenExchange')}}|ConvertTo-Json -Depth 5
          $fic=Invoke-WebRequest -Method Put -Uri $ficUri -Headers @{Authorization="Bearer $token"} -ContentType 'application/json' -Body $ficBody -SkipHttpErrorCheck
          if([int]$fic.StatusCode -lt 200 -or [int]$fic.StatusCode -ge 300){throw "Federation create failed HTTP $($fic.StatusCode): $([string]$fic.Content)"}
          @('STATE=federation_created',"SUBJECT=$env:OIDC_SUBJECT",'AUDIENCE=api://AzureADTokenExchange')|Set-Content (Join-Path $d 'status.txt') -Encoding ascii
          Push-Location $d; git add status.txt; git commit -m 'Record permanent Azure federation'|Out-Null; git push --force origin azure-device-auth-final|Out-Null; Pop-Location
          Start-Sleep -Seconds 15
          $aud=[uri]::EscapeDataString('api://AzureADTokenExchange'); $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL -match '\?'){'&'}else{'?'}; $oidcUrl="$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$sep"+"audience=$aud"
          $gh=Invoke-RestMethod -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -Uri $oidcUrl -Method Get
          $ok=$false
          for($i=1;$i -le 12;$i++){& az login --service-principal --username $env:AZURE_CLIENT_ID --tenant $env:AZURE_TENANT_ID --federated-token $gh.value --allow-no-subscriptions | Out-Null;if($LASTEXITCODE -eq 0){$ok=$true;break};Start-Sleep -Seconds 10}
          if(-not $ok){throw 'OIDC login failed after federation creation.'}
          az account set --subscription $env:AZURE_SUBSCRIPTION_ID

      - name: Deploy current source
        id: deploy
        if: steps.oidc.outcome == 'success' || steps.bootstrap.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app=az webapp show -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP|ConvertFrom-Json
          if(-not $app.id){throw 'Target App Service inaccessible.'}
          az webapp start -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP|Out-Null
          az webapp deploy -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP --src-path $env:DEPLOY_ZIP --type zip --clean true --restart true|Out-Null
          if($LASTEXITCODE -ne 0){throw 'Azure ZIP deployment failed.'}
          az webapp restart -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP|Out-Null
          @('DEPLOYED=true',"TARGET_HOST=$($app.defaultHostName)")|Set-Content (Join-Path $env:RUNNER_TEMP 'deploy.txt')

      - name: Verify live login flow
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Start-Sleep -Seconds 20
          $s=New-Object Microsoft.PowerShell.Commands.WebRequestSession; $l=$null
          for($i=1;$i -le 24;$i++){try{$l=Invoke-WebRequest $env:LOGIN_URL -WebSession $s -UseBasicParsing -TimeoutSec 30;if([int]$l.StatusCode -eq 200 -and $l.Content -match 'Continue Without Microsoft \(Temporary\)' -and $l.Content -match 'Azure App Service Easy Auth'){break}}catch{};Start-Sleep -Seconds 5}
          if($null -eq $l -or [int]$l.StatusCode -ne 200){throw 'Login page unavailable or new source not live.'}
          function H($n,$h){$m=[regex]::Match($h,'name="'+[regex]::Escape($n)+'"[^>]*value="([^"]*)"');if($m.Success){return [Net.WebUtility]::HtmlDecode($m.Groups[1].Value)};return ''}
          $b=@{'__VIEWSTATE'=H '__VIEWSTATE' $l.Content;'__VIEWSTATEGENERATOR'=H '__VIEWSTATEGENERATOR' $l.Content;'__EVENTVALIDATION'=H '__EVENTVALIDATION' $l.Content;'btnTemporary'='Continue Without Microsoft (Temporary)'}
          Invoke-WebRequest $env:LOGIN_URL -Method Post -Body $b -WebSession $s -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 30|Out-Null
          $d=Invoke-WebRequest $env:DEFAULT_URL -WebSession $s -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30
          if([int]$d.StatusCode -ne 200 -or $d.Content -notmatch 'Babco SQL AI Agent'){throw 'Temporary login session failed.'}
          $es=0;$loc='';try{$e=Invoke-WebRequest $env:EASY_AUTH_URL -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30;$es=[int]$e.StatusCode;$loc=[string]$e.Headers.Location}catch{if($_.Exception.Response){$es=[int]$_.Exception.Response.StatusCode;try{$loc=[string]$_.Exception.Response.Headers.Location}catch{}}}
          if($es -lt 300 -or $es -ge 400){throw "Easy Auth HTTP $es"}
          @('VERIFIED_LIVE=true','LOGIN_HTTP=200','TEMP_SESSION=true','DEFAULT_HTTP=200',"EASY_AUTH_HTTP=$es","EASY_AUTH_LOCATION=$loc","LOGIN_URL=$env:LOGIN_URL","DEFAULT_URL=$env:DEFAULT_URL")|Set-Content (Join-Path $env:RUNNER_TEMP 'verify.txt')

      - name: Publish final status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_RESULT: ${{ steps.oidc.outcome }}
          BOOTSTRAP_RESULT: ${{ steps.bootstrap.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'status';New-Item -ItemType Directory -Path $d -Force|Out-Null
          $x=@("SOURCE_COMMIT=$env:GITHUB_SHA","OIDC=$env:OIDC_RESULT","BOOTSTRAP=$env:BOOTSTRAP_RESULT","DEPLOY=$env:DEPLOY_RESULT","VERIFY=$env:VERIFY_RESULT");foreach($f in @('deploy.txt','verify.txt')){$p=Join-Path $env:RUNNER_TEMP $f;if(Test-Path $p){$x+=Get-Content $p}};$x+="CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))";$x|Set-Content (Join-Path $d 'status.txt') -Encoding ascii
          Push-Location $d;git init|Out-Null;git checkout -b final-deployment-status|Out-Null;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add status.txt;git commit -m 'Publish final deployment status'|Out-Null;git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git";git push --force origin final-deployment-status|Out-Null;Pop-Location

      - name: Require verified live deployment
        if: always()
        shell: pwsh
        run: |
          if('${{ steps.deploy.outcome }}' -ne 'success'){throw 'Deployment failed.'}
          if('${{ steps.verify.outcome }}' -ne 'success'){throw 'Verification failed.'}
