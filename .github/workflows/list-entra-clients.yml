name: List Entra Clients

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/list-entra-clients.yml'
      - 'ops/run-list-entra-clients.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  RG: 'rg-babco-rnd-sandbox'

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: List safe Entra metadata
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/status.txt"
          echo "SOURCE_COMMIT=$GITHUB_SHA" > "$out"
          apps=$(az webapp list -g "$RG" --query '[].name' -o tsv --only-show-errors)
          count=0
          for app in $apps; do
            auth=$(az webapp auth microsoft show -g "$RG" -n "$app" -o json --only-show-errors 2>/dev/null)
            [ $? -ne 0 ] && continue
            client=$(printf '%s' "$auth" | jq -r '.registration.clientId // .clientId // empty')
            secretSetting=$(printf '%s' "$auth" | jq -r '.registration.clientSecretSettingName // .clientSecretSettingName // empty')
            issuer=$(printf '%s' "$auth" | jq -r '.registration.openIdIssuer // .openIdIssuer // empty')
            [ -z "$client" ] && continue
            present=false
            if [ -n "$secretSetting" ]; then
              sv=$(az webapp config appsettings list -g "$RG" -n "$app" --query "[?name=='$secretSetting'].value | [0]" -o tsv --only-show-errors 2>/dev/null)
              [ -n "$sv" ] && [ "$sv" != 'null' ] && present=true
            fi
            echo "APP=$app|CLIENT_ID=$client|SECRET_PRESENT=$present|ISSUER=$issuer" >> "$out"
            count=$((count+1))
          done
          echo "CLIENT_CONFIG_COUNT=$count" >> "$out"
          echo "CHECKED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$out"
      - name: Publish
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          d="$RUNNER_TEMP/pub"; mkdir -p "$d"
          cp "$RUNNER_TEMP/status.txt" "$d/status.txt" 2>/dev/null || echo 'RUN_FAILED=true' > "$d/status.txt"
          cd "$d"; git init -q; git checkout -q -b entra-client-list-status
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt; git commit -q -m 'Publish Entra client list'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin entra-client-list-status >/dev/null
