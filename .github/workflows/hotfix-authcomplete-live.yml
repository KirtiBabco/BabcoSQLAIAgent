name: Hotfix AuthComplete Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-authcomplete-live.yml'
      - 'ops/run-authcomplete-hotfix.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  RG: 'rg-babco-rnd-sandbox'
  APP: 'babco-sqlagent-wf-2c606af4'

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Update only AuthComplete.aspx through Kudu
        shell: bash
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/status.txt"
          echo "SOURCE_COMMIT=$GITHUB_SHA" > "$status"
          profiles=$(az webapp deployment list-publishing-profiles -g "$RG" -n "$APP" -o json --only-show-errors)
          user=$(jq -r '[.[] | select(.publishMethod=="MSDeploy" or .publishMethod=="ZipDeploy")][0].userName // empty' <<< "$profiles")
          pass=$(jq -r '[.[] | select(.publishMethod=="MSDeploy" or .publishMethod=="ZipDeploy")][0].userPWD // empty' <<< "$profiles")
          test -n "$user" && test -n "$pass"
          echo "::add-mask::$user"
          echo "::add-mask::$pass"
          code=$(curl -sS -u "$user:$pass" -X PUT -H 'Content-Type: application/octet-stream' --data-binary @AuthComplete.aspx -o "$RUNNER_TEMP/put.out" -w '%{http_code}' "https://${APP}.scm.azurewebsites.net/api/vfs/site/wwwroot/AuthComplete.aspx")
          echo "KUDU_PUT_HTTP=$code" >> "$status"
          test "$code" = '200' -o "$code" = '201' -o "$code" = '204'
          az webapp restart -g "$RG" -n "$APP" --only-show-errors >/dev/null
          echo 'HOTFIX_APPLIED=true' >> "$status"

      - name: Verify Login, Entra challenge, and AuthComplete parser
        shell: bash
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/status.txt"
          login="https://${APP}.azurewebsites.net/Login.aspx"
          loginCode=0
          for i in $(seq 1 40); do
            loginCode=$(curl -k -sS -L -o "$RUNNER_TEMP/login.html" -w '%{http_code}' --max-time 20 "$login" || true)
            if [ "$loginCode" = '200' ]; then break; fi
            sleep 3
          done
          echo "LOGIN_HTTP=$loginCode" >> "$status"

          auth="https://${APP}.azurewebsites.net/.auth/login/aad?post_login_redirect_uri=%2FAuthComplete.aspx"
          curl -k -sS --max-time 20 --max-redirs 0 -D "$RUNNER_TEMP/auth.headers" -o /dev/null "$auth" || true
          loc=$(tr -d '\r' < "$RUNNER_TEMP/auth.headers" | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]*:[[:space:]]*/,""); print; exit}')
          if printf '%s' "$loc" | grep -Eqi '^https://login\.microsoftonline\.com/'; then echo 'ENTRA_CHALLENGE=true' >> "$status"; else echo 'ENTRA_CHALLENGE=false' >> "$status"; fi

          callbackCode=$(curl -k -sS -o "$RUNNER_TEMP/callback.html" -w '%{http_code}' --max-time 20 "https://${APP}.azurewebsites.net/AuthComplete.aspx" || true)
          echo "AUTHCOMPLETE_HTTP=$callbackCode" >> "$status"
          if grep -Fq "Could not load type 'SQL_AI_Agent.AuthComplete'" "$RUNNER_TEMP/callback.html"; then echo 'AUTHCOMPLETE_TYPE_ERROR=true' >> "$status"; else echo 'AUTHCOMPLETE_TYPE_ERROR=false' >> "$status"; fi
          if [ "$loginCode" = '200' ] && grep -q '^ENTRA_CHALLENGE=true$' "$status" && grep -q '^AUTHCOMPLETE_TYPE_ERROR=false$' "$status"; then echo 'VERIFY=success' >> "$status"; else echo 'VERIFY=failure' >> "$status"; fi
          echo "LIVE_URL=$login" >> "$status"
          echo "CHECKED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$status"

      - name: Publish hotfix status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          d="$RUNNER_TEMP/pub"; mkdir -p "$d"
          p="$RUNNER_TEMP/status.txt"
          if [ -f "$p" ]; then cp "$p" "$d/status.txt"; else echo 'RUN_FAILED=true' > "$d/status.txt"; fi
          cd "$d"
          git init -q
          git checkout -q -b authcomplete-hotfix-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -q -m 'Publish AuthComplete hotfix status'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin authcomplete-hotfix-status >/dev/null
