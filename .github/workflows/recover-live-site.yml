name: Recover Babco SQL AI Agent Live Site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-live-site.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  WEB_APP: babco-sqlagent-wf-2c606af4

jobs:
  recover:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Rebuild known-good package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem "$env:GITHUB_WORKSPACE/source-package" -Filter 'part*.b64' | Sort-Object Name
          $b64=($parts | ForEach-Object {(Get-Content $_.FullName -Raw).Trim()}) -join ''
          $sourceZip=Join-Path $env:RUNNER_TEMP 'source.zip'
          [IO.File]::WriteAllBytes($sourceZip,[Convert]::FromBase64String($b64))
          $extract=Join-Path $env:RUNNER_TEMP 'source'
          Expand-Archive $sourceZip $extract -Force
          $site=Join-Path $extract 'SQL_AI_Agent'
          $overrides=Join-Path $env:GITHUB_WORKSPACE 'deploy-overrides'
          Get-ChildItem $overrides -Recurse -File | ForEach-Object {
            $rel=$_.FullName.Substring($overrides.Length).TrimStart([char[]]@('\\','/'))
            $dest=Join-Path $site $rel
            $parent=Split-Path $dest -Parent
            if(-not(Test-Path $parent)){New-Item -ItemType Directory -Path $parent -Force|Out-Null}
            Copy-Item $_.FullName $dest -Force
          }
          $zip=Join-Path $env:RUNNER_TEMP 'site.zip'
          Compress-Archive -Path (Join-Path $site '*') -DestinationPath $zip -Force

      - name: Normalize global Babco connection safely
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $settings=az webapp config appsettings list -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP -o json | ConvertFrom-Json
          $item=@($settings|Where-Object{$_.name -eq 'BAP_SUPPORT_CONNECTION_STRING'})
          if($item.Count -lt 1){throw 'BAP_SUPPORT_CONNECTION_STRING missing'}
          $v=[string]$item[0].value
          Write-Output "::add-mask::$v"
          $v=[regex]::Replace($v,'(?i)\bConnectTimeout\s*=','Connect Timeout=')
          $v=[regex]::Replace($v,'(?i)(^|;)\s*Timeout\s*=','$1Connect Timeout=')
          Write-Output "::add-mask::$v"
          az webapp config appsettings set -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP --settings "BAP_SUPPORT_CONNECTION_STRING=$v" "SQL_BAP_SUPPORT_CONNECTION_STRING=$v" "SQL_CONNECTION_STRING=$v" --only-show-errors | Out-Null

      - name: Recover site with non-destructive retry deploy
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $zip=Join-Path $env:RUNNER_TEMP 'site.zip'
          az webapp start -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP --only-show-errors | Out-Null
          $ok=$false
          for($i=1;$i -le 5;$i++){
            az webapp deploy -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP --src-path $zip --type zip --restart true --only-show-errors | Out-Null
            if($LASTEXITCODE -eq 0){$ok=$true;break}
            Start-Sleep -Seconds (10*$i)
          }
          if(-not $ok){throw 'Recovery ZIP deploy failed after retries.'}
          az webapp restart -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP --only-show-errors | Out-Null
          Start-Sleep -Seconds 25

      - name: Verify Login restored
        shell: pwsh
        run: |
          $url="https://$env:WEB_APP.azurewebsites.net/Login.aspx"
          $code=0
          for($i=1;$i -le 12;$i++){
            try{$r=Invoke-WebRequest -Uri $url -MaximumRedirection 5 -UseBasicParsing -TimeoutSec 25;$code=[int]$r.StatusCode}catch{$code=0}
            if($code -eq 200){break}
            Start-Sleep -Seconds 5
          }
          if($code -ne 200){throw "Login recovery failed HTTP=$code"}
          Write-Host 'LOGIN_HTTP=200'

      - name: Publish recovery status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'recovery-status';New-Item -ItemType Directory -Path $d -Force|Out-Null
          "SOURCE_COMMIT=$env:GITHUB_SHA"|Set-Content (Join-Path $d 'status.txt') -Encoding ascii
          try{$r=Invoke-WebRequest -Uri "https://$env:WEB_APP.azurewebsites.net/Login.aspx" -MaximumRedirection 5 -UseBasicParsing -TimeoutSec 20;Add-Content (Join-Path $d 'status.txt') "LOGIN_HTTP=$([int]$r.StatusCode)"}catch{Add-Content (Join-Path $d 'status.txt') 'LOGIN_HTTP=0'}
          Add-Content (Join-Path $d 'status.txt') "CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))"
          Push-Location $d;git init|Out-Null;git checkout -b recovery-status|Out-Null;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add status.txt;git commit -m 'Publish recovery status'|Out-Null;git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git";git push --force origin recovery-status|Out-Null;Pop-Location
