name: Repair Global Babco Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-global-babco-runtime.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  RESOURCE_GROUP: rg-babco-rnd-sandbox
  WEB_APP: babco-sqlagent-wf-2c606af4

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Normalize existing global Babco connection and restart app
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $items = az webapp config appsettings list -g $env:RESOURCE_GROUP -n $env:WEB_APP -o json --only-show-errors | ConvertFrom-Json
          $item = @($items | Where-Object { $_.name -eq 'BAP_SUPPORT_CONNECTION_STRING' } | Select-Object -First 1)
          if($item.Count -eq 0 -or [string]::IsNullOrWhiteSpace([string]$item[0].value)){ throw 'BAP_SUPPORT_CONNECTION_STRING missing.' }
          $cs=[string]$item[0].value
          Write-Output "::add-mask::$cs"
          $cs=[regex]::Replace($cs,'(?i)\bConnectTimeout\s*=','Connect Timeout=')
          $cs=[regex]::Replace($cs,'(?i)\bConnectionTimeout\s*=','Connect Timeout=')
          $cs=[regex]::Replace($cs,'(?i)(^|;)\s*Timeout\s*=','$1Connect Timeout=')
          Write-Output "::add-mask::$cs"
          Add-Type -AssemblyName System.Data
          $b=[System.Data.SqlClient.SqlConnectionStringBuilder]::new($cs)
          $b.ConnectTimeout=15
          $normalized=$b.ConnectionString
          Write-Output "::add-mask::$normalized"
          az webapp config appsettings set -g $env:RESOURCE_GROUP -n $env:WEB_APP --settings "BAP_SUPPORT_CONNECTION_STRING=$normalized" "SQL_BAP_SUPPORT_CONNECTION_STRING=$normalized" "SQL_CONNECTION_STRING=$normalized" --only-show-errors | Out-Null
          az webapp start -g $env:RESOURCE_GROUP -n $env:WEB_APP --only-show-errors | Out-Null
          az webapp restart -g $env:RESOURCE_GROUP -n $env:WEB_APP --only-show-errors | Out-Null
          Start-Sleep -Seconds 20

      - name: Publish repair marker
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'repair-status';New-Item -ItemType Directory -Path $d -Force|Out-Null
          @('REPAIR=success',"SOURCE_COMMIT=$env:GITHUB_SHA","CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))") | Set-Content (Join-Path $d 'status.txt') -Encoding ascii
          Push-Location $d;git init|Out-Null;git checkout -b global-babco-repair-status|Out-Null;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add status.txt;git commit -m 'Publish global Babco runtime repair status'|Out-Null;git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git";git push --force origin global-babco-repair-status|Out-Null;Pop-Location
