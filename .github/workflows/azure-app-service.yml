name: Deploy Babco SQL AI Agent to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  AZURE_WEBAPP_NAME: babco-sqlagent-wf-2c606af4
  LOGIN_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx
  DEFAULT_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Default.aspx
  EASY_AUTH_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad

jobs:
  deploy-and-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'sqlagent-stage'
          $zip = Join-Path $env:RUNNER_TEMP 'sqlagent.zip'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','.github') } | ForEach-Object {
            Copy-Item $_.FullName $stage -Recurse -Force
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          "DEPLOY_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Azure login with existing OIDC identity
        id: azurelogin
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Direct federated login fallback and diagnostic
        id: manuallogin
        if: steps.azurelogin.outcome != 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $audience = [uri]::EscapeDataString('api://AzureADTokenExchange')
          $separator = if ($env:ACTIONS_ID_TOKEN_REQUEST_URL -match '\?') { '&' } else { '?' }
          $oidcUrl = "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$separator`audience=$audience"
          $oidc = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -Uri $oidcUrl -Method Get
          if ([string]::IsNullOrWhiteSpace($oidc.value)) { throw 'GitHub OIDC token was empty.' }
          $raw = Join-Path $env:RUNNER_TEMP 'oidc-login-raw.txt'
          $output = & az login --service-principal --username "$env:AZURE_CLIENT_ID" --tenant "$env:AZURE_TENANT_ID" --federated-token $oidc.value --allow-no-subscriptions 2>&1
          $exit = $LASTEXITCODE
          $output | Out-File $raw -Encoding utf8
          $safe = @($output | ForEach-Object { [string]$_ } | Where-Object { $_ -match 'AADSTS|federated|identity|subject|issuer|credential|matching|application|tenant|subscription' } | Select-Object -First 25)
          if ($safe.Count -eq 0) { $safe = @("az login exit code: $exit") }
          $safe | Out-File $env:RUNNER_TEMP\oidc-diagnostic.txt -Encoding ascii
          if ($exit -ne 0) { throw "Direct federated az login failed with exit code $exit." }
          az account set --subscription "$env:AZURE_SUBSCRIPTION_ID"
          "MANUAL_OIDC_LOGIN=true" | Out-File $env:RUNNER_TEMP\oidc-manual.txt -Encoding ascii

      - name: Verify Azure target access
        id: target
        if: steps.azurelogin.outcome == 'success' || steps.manuallogin.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = az webapp show -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_WEBAPP_NAME" | ConvertFrom-Json
          if (-not $app.id) { throw 'Target App Service not found or inaccessible.' }
          "TARGET_ACCESS=true" | Out-File $env:RUNNER_TEMP\azure.txt -Encoding ascii
          "TARGET_HOST=$($app.defaultHostName)" | Out-File $env:RUNNER_TEMP\azure.txt -Append -Encoding ascii

      - name: Deploy current main ZIP to App Service
        id: deploy
        if: steps.target.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          az webapp start -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_WEBAPP_NAME" | Out-Null
          az webapp config appsettings set -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_WEBAPP_NAME" --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false WEBSITE_RUN_FROM_PACKAGE=0 | Out-Null
          az webapp deploy -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_WEBAPP_NAME" --src-path "$env:DEPLOY_ZIP" --type zip --clean true --restart true | Out-Null
          az webapp restart -g "$env:AZURE_RESOURCE_GROUP" -n "$env:AZURE_WEBAPP_NAME" | Out-Null
          "DEPLOYED=true" | Out-File $env:RUNNER_TEMP\deploy.txt -Encoding ascii

      - name: Verify live temporary login end-to-end
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 20
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $login = $null
          for ($i=1; $i -le 24; $i++) {
            try {
              $login = Invoke-WebRequest -Uri $env:LOGIN_URL -WebSession $session -UseBasicParsing -TimeoutSec 30
              if ([int]$login.StatusCode -eq 200 -and $login.Content -match 'Continue Without Microsoft \(Temporary\)') { break }
            } catch { }
            Start-Sleep -Seconds 5
          }
          if ($null -eq $login -or [int]$login.StatusCode -ne 200) { throw 'Login.aspx did not return HTTP 200.' }
          if ($login.Content -notmatch 'Continue Without Microsoft \(Temporary\)') { throw 'Temporary login button is missing.' }
          if ($login.Content -notmatch 'Azure App Service Easy Auth') { throw 'New Easy Auth source marker is missing from live Login.aspx.' }

          function Hidden([string]$name, [string]$html) {
            $pattern = 'name="' + [regex]::Escape($name) + '"[^>]*value="([^"]*)"'
            $m = [regex]::Match($html, $pattern, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
            if ($m.Success) { return [System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value) }
            return ''
          }

          $body = @{
            '__VIEWSTATE' = Hidden '__VIEWSTATE' $login.Content
            '__VIEWSTATEGENERATOR' = Hidden '__VIEWSTATEGENERATOR' $login.Content
            '__EVENTVALIDATION' = Hidden '__EVENTVALIDATION' $login.Content
            'btnTemporary' = 'Continue Without Microsoft (Temporary)'
          }
          Invoke-WebRequest -Uri $env:LOGIN_URL -Method Post -Body $body -WebSession $session -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 30 | Out-Null
          $default = Invoke-WebRequest -Uri $env:DEFAULT_URL -WebSession $session -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30
          if ([int]$default.StatusCode -ne 200) { throw "Default.aspx returned HTTP $($default.StatusCode)." }
          if ($default.Content -notmatch 'Babco SQL AI Agent') { throw 'Default.aspx content marker is missing.' }
          "LOGIN_HTTP=200" | Out-File $env:RUNNER_TEMP\verify.txt -Encoding ascii
          "NEW_SOURCE_LIVE=true" | Out-File $env:RUNNER_TEMP\verify.txt -Append -Encoding ascii
          "TEMP_BUTTON=true" | Out-File $env:RUNNER_TEMP\verify.txt -Append -Encoding ascii
          "TEMP_SESSION=true" | Out-File $env:RUNNER_TEMP\verify.txt -Append -Encoding ascii
          "DEFAULT_HTTP=200" | Out-File $env:RUNNER_TEMP\verify.txt -Append -Encoding ascii

      - name: Probe App Service Easy Auth
        id: easyauth
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $status = 0
          $location = ''
          try {
            $r = Invoke-WebRequest -Uri $env:EASY_AUTH_URL -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30
            $status = [int]$r.StatusCode
            $location = [string]$r.Headers.Location
          } catch {
            if ($_.Exception.Response) {
              $status = [int]$_.Exception.Response.StatusCode
              try { $location = [string]$_.Exception.Response.Headers.Location } catch { }
            }
          }
          "EASY_AUTH_HTTP=$status" | Out-File $env:RUNNER_TEMP\easyauth.txt -Encoding ascii
          "EASY_AUTH_LOCATION=$location" | Out-File $env:RUNNER_TEMP\easyauth.txt -Append -Encoding ascii
          $ready = ($status -ge 300 -and $status -lt 400)
          "EASY_AUTH_READY=$ready" | Out-File $env:RUNNER_TEMP\easyauth.txt -Append -Encoding ascii

      - name: Publish deployment status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN_OUTCOME: ${{ steps.azurelogin.outcome }}
          MANUAL_LOGIN_OUTCOME: ${{ steps.manuallogin.outcome }}
          TARGET_OUTCOME: ${{ steps.target.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          EASYAUTH_OUTCOME: ${{ steps.easyauth.outcome }}
        run: |
          set -euo pipefail
          mkdir out && cd out
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Azure OIDC action login: ${LOGIN_OUTCOME:-unknown}"
            echo "Direct federated login fallback: ${MANUAL_LOGIN_OUTCOME:-unknown}"
            echo "Azure target access: ${TARGET_OUTCOME:-unknown}"
            echo "Azure ZIP deploy: ${DEPLOY_OUTCOME:-unknown}"
            echo "End-to-end temporary login verify: ${VERIFY_OUTCOME:-unknown}"
            echo "Easy Auth probe step: ${EASYAUTH_OUTCOME:-unknown}"
            [ -f "$RUNNER_TEMP/oidc-diagnostic.txt" ] && cat "$RUNNER_TEMP/oidc-diagnostic.txt" || true
            [ -f "$RUNNER_TEMP/oidc-manual.txt" ] && cat "$RUNNER_TEMP/oidc-manual.txt" || true
            [ -f "$RUNNER_TEMP/azure.txt" ] && cat "$RUNNER_TEMP/azure.txt" || true
            [ -f "$RUNNER_TEMP/deploy.txt" ] && cat "$RUNNER_TEMP/deploy.txt" || true
            [ -f "$RUNNER_TEMP/verify.txt" ] && cat "$RUNNER_TEMP/verify.txt" || true
            [ -f "$RUNNER_TEMP/easyauth.txt" ] && cat "$RUNNER_TEMP/easyauth.txt" || true
            echo "LOGIN_URL=$LOGIN_URL"
            echo "DEFAULT_URL=$DEFAULT_URL"
            echo "Checked: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > status.txt
          git init
          git checkout -b deployment-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -m 'Publish SQL Agent deployment status'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin deployment-status

      - name: Fail when live deployment verification failed
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.deploy.outcome }}' -ne 'success') { throw 'Azure deployment failed.' }
          if ('${{ steps.verify.outcome }}' -ne 'success') { throw 'Live temporary-login verification failed.' }
