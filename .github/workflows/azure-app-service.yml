name: Deploy Babco SQL AI Agent to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

# Production deployments are serialized; only the newest run may deploy/restart the App Service.
# Backend health runs through the known-working Login.aspx worker with a one-time server-side token.
concurrency:
  group: babco-sqlagent-production
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  WEB_APP: babco-sqlagent-wf-2c606af4
  LOGIN_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx
  DEFAULT_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Default.aspx
  EASY_AUTH_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad

jobs:
  deploy-and-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with permanent GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Deploy full source and require live SQL OpenAI Entra health
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy-and-verify.ps1
