name: Deploy Babco SQL AI Agent to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  WEB_APP: babco-sqlagent-wf-2c606af4
  SOURCE_PACKAGE_SHA256: b02c69ab1b4ab431f823a2e3327faada3019f1a815470dd445e321128ca2559a
  LOGIN_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx
  DEFAULT_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Default.aspx
  EASY_AUTH_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with permanent GitHub federation
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Verify server-side settings
        id: settings
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $settings = az webapp config appsettings list -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP | ConvertFrom-Json
          $sql = @($settings | Where-Object { $_.name -eq 'BAP_SUPPORT_CONNECTION_STRING' })
          $openai = @($settings | Where-Object { $_.name -eq 'OPENAI_API_KEY_DEVELOPMENT' })
          $sqlPresent = $sql.Count -gt 0 -and -not [string]::IsNullOrWhiteSpace([string]$sql[0].value)
          $openaiPresent = $openai.Count -gt 0 -and -not [string]::IsNullOrWhiteSpace([string]$openai[0].value)
          "SQL_SETTING_PRESENT=$($sqlPresent.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OPENAI_SETTING_PRESENT=$($openaiPresent.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if(-not $sqlPresent){ throw 'BAP_SUPPORT_CONNECTION_STRING is missing on the Azure App Service.' }

      - name: Reconstruct and validate full source package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'source-package') -Filter 'part*.b64' | Sort-Object Name
          if($parts.Count -ne 12){ throw "Expected 12 source package parts; found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $sourceZip = Join-Path $env:RUNNER_TEMP 'source.zip'
          [IO.File]::WriteAllBytes($sourceZip,[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne $env:SOURCE_PACKAGE_SHA256){ throw "Source package hash mismatch: $hash" }
          $extract=Join-Path $env:RUNNER_TEMP 'source'; if(Test-Path $extract){Remove-Item $extract -Recurse -Force}; Expand-Archive $sourceZip $extract -Force
          $site=Join-Path $extract 'SQL_AI_Agent'; if(-not (Test-Path (Join-Path $site 'Login.aspx'))){ throw 'Expected SQL_AI_Agent site folder is missing.' }
          $deployZip=Join-Path $env:RUNNER_TEMP 'site.zip'; if(Test-Path $deployZip){Remove-Item $deployZip -Force}
          Compress-Archive -Path (Join-Path $site '*') -DestinationPath $deployZip -Force
          "DEPLOY_ZIP=$deployZip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_HASH=$hash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Deploy to existing Azure App Service
        id: deploy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          az webapp start -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP | Out-Null
          az webapp deploy -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP --src-path $env:DEPLOY_ZIP --type zip --clean true --restart true | Out-Null
          if($LASTEXITCODE -ne 0){ throw 'Azure ZIP deployment failed.' }
          az webapp restart -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP | Out-Null

      - name: Verify live Entra-only application
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Start-Sleep -Seconds 20
          $login=$null
          for($i=1;$i -le 24;$i++){
            try{$login=Invoke-WebRequest $env:LOGIN_URL -UseBasicParsing -TimeoutSec 30;if([int]$login.StatusCode -eq 200 -and $login.Content -match 'Azure App Service Easy Auth'){break}}catch{}
            Start-Sleep -Seconds 5
          }
          if($null -eq $login -or [int]$login.StatusCode -ne 200){throw 'Login.aspx is not healthy.'}
          if($login.Content -match 'Local Test Admin Login' -or $login.Content -match 'Continue Without Microsoft' -or $login.Content -match 'LOCAL-ADMIN'){throw 'A local/temporary login bypass is still present.'}
          if($login.Content -notmatch 'Sign in with Microsoft Entra ID'){throw 'Microsoft Entra sign-in button is missing.'}

          $easy=0;$easyLocation=''
          try{$r=Invoke-WebRequest $env:EASY_AUTH_URL -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30;$easy=[int]$r.StatusCode;$easyLocation=[string]$r.Headers.Location}catch{if($_.Exception.Response){$easy=[int]$_.Exception.Response.StatusCode;try{$easyLocation=[string]$_.Exception.Response.Headers.Location}catch{}}}
          if($easy -lt 300 -or $easy -ge 400){throw "Easy Auth endpoint returned HTTP $easy instead of a Microsoft redirect."}

          $defaultStatus=0;$defaultLocation=''
          try{$d=Invoke-WebRequest $env:DEFAULT_URL -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30;$defaultStatus=[int]$d.StatusCode;$defaultLocation=[string]$d.Headers.Location}catch{if($_.Exception.Response){$defaultStatus=[int]$_.Exception.Response.StatusCode;try{$defaultLocation=[string]$_.Exception.Response.Headers.Location}catch{}}}
          if($defaultStatus -lt 300 -or $defaultStatus -ge 400){throw "Unauthenticated Default.aspx should redirect to Login.aspx but returned HTTP $defaultStatus."}

          "LOGIN_HTTP=200" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOCAL_ADMIN_REMOVED=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "EASY_AUTH_HTTP=$easy" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DEFAULT_UNAUTH_HTTP=$defaultStatus" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VERIFIED_LIVE=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish safe deployment status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'status'; if(Test-Path $d){Remove-Item $d -Recurse -Force}; New-Item -ItemType Directory -Path $d -Force|Out-Null
          @(
            "SOURCE_COMMIT=$env:GITHUB_SHA",
            "SOURCE_PACKAGE_SHA256=$env:PACKAGE_HASH",
            "SQL_SETTING_PRESENT=$env:SQL_SETTING_PRESENT",
            "OPENAI_SETTING_PRESENT=$env:OPENAI_SETTING_PRESENT",
            "DEPLOY=$env:DEPLOY_RESULT",
            "VERIFY=$env:VERIFY_RESULT",
            "LOGIN_HTTP=$env:LOGIN_HTTP",
            "LOCAL_ADMIN_REMOVED=$env:LOCAL_ADMIN_REMOVED",
            "EASY_AUTH_HTTP=$env:EASY_AUTH_HTTP",
            "DEFAULT_UNAUTH_HTTP=$env:DEFAULT_UNAUTH_HTTP",
            "VERIFIED_LIVE=$env:VERIFIED_LIVE",
            "LOGIN_URL=$env:LOGIN_URL",
            "CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content (Join-Path $d 'status.txt') -Encoding ascii
          Push-Location $d
          git init | Out-Null; git checkout -b deployment-status | Out-Null
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt; git commit -m 'Publish SQL Agent deployment status' | Out-Null
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git push --force origin deployment-status | Out-Null
          Pop-Location

      - name: Require verified live deployment
        if: always()
        shell: pwsh
        run: |
          if('${{ steps.deploy.outcome }}' -ne 'success'){throw 'Deployment failed.'}
          if('${{ steps.verify.outcome }}' -ne 'success'){throw 'Live verification failed.'}
