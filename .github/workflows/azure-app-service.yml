name: Check Babco SQL AI Agent live status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  LIVE_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx

jobs:
  verify-live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify live Entra readiness
        id: health
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Invoke-WebRequest -Uri $env:LIVE_URL -UseBasicParsing -TimeoutSec 30
          $content = $r.Content
          $http = [int]$r.StatusCode
          $button = $content -match 'Sign in with Microsoft Entra ID'
          $incomplete = ($content -match 'Microsoft Entra login setup is incomplete') -or ($content -match 'Entra setup required')
          $clientMissing = $content -match 'ENTRA_CLIENT_ID'
          "HTTP_CODE=$http" | Out-File -FilePath $env:RUNNER_TEMP\live.txt -Encoding ascii
          "BUTTON=$button" | Out-File -FilePath $env:RUNNER_TEMP\live.txt -Append -Encoding ascii
          "INCOMPLETE=$incomplete" | Out-File -FilePath $env:RUNNER_TEMP\live.txt -Append -Encoding ascii
          "CLIENT_MISSING=$clientMissing" | Out-File -FilePath $env:RUNNER_TEMP\live.txt -Append -Encoding ascii
          Write-Host "HTTP=$http Button=$button Incomplete=$incomplete ClientMissing=$clientMissing"
          if ($http -ne 200) { throw "Live page HTTP $http" }

      - name: Publish safe status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_CODE=unknown; BUTTON=unknown; INCOMPLETE=unknown; CLIENT_MISSING=unknown
          if [ -f "$RUNNER_TEMP/live.txt" ]; then
            HTTP_CODE="$(sed -n 's/^HTTP_CODE=//p' "$RUNNER_TEMP/live.txt" | tr -d '\r')"
            BUTTON="$(sed -n 's/^BUTTON=//p' "$RUNNER_TEMP/live.txt" | tr -d '\r')"
            INCOMPLETE="$(sed -n 's/^INCOMPLETE=//p' "$RUNNER_TEMP/live.txt" | tr -d '\r')"
            CLIENT_MISSING="$(sed -n 's/^CLIENT_MISSING=//p' "$RUNNER_TEMP/live.txt" | tr -d '\r')"
          fi
          mkdir out && cd out
          {
            echo "Live URL: $LIVE_URL"
            echo "HTTP: $HTTP_CODE"
            echo "Microsoft button: $BUTTON"
            echo "Entra setup incomplete: $INCOMPLETE"
            echo "ENTRA_CLIENT_ID missing message: $CLIENT_MISSING"
            echo "Checked: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > status.txt
          git init
          git checkout -b deployment-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt
          git commit -m 'Publish SQL Agent live auth status'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin deployment-status
