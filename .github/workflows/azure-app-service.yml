name: Deploy Babco SQL AI Agent to Azure

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ops/run-admin-ui-deploy.txt'
      - '.github/workflows/deploy-admin-ui.yml'
      - '.github/workflows/azure-app-service.yml'
  workflow_dispatch:

concurrency:
  group: babco-sqlagent-production
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  WEB_APP: babco-sqlagent-wf-2c606af4
  GLOBAL_BABCO_SOURCE_APP: app-babco-unloadcompare-0e27b0b7-260818
  GLOBAL_BABCO_CONNECTION_NAME: BabcoSupportConnectionString
  LOGIN_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx
  DEFAULT_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Default.aspx
  EASY_AUTH_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad

jobs:
  deploy-and-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with permanent GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Reuse Babco App Service connection-string secret
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bap = az webapp config connection-string list `
            -g $env:AZURE_RESOURCE_GROUP `
            -n $env:GLOBAL_BABCO_SOURCE_APP `
            --query "[?name=='$($env:GLOBAL_BABCO_CONNECTION_NAME)'].value | [0]" `
            -o tsv `
            --only-show-errors
          if ([string]::IsNullOrWhiteSpace($bap) -or $bap -eq 'null') {
            throw "BabcoSupportConnectionString was not found on $($env:GLOBAL_BABCO_SOURCE_APP)."
          }
          Write-Output "::add-mask::$bap"
          $bap = [regex]::Replace([string]$bap, '(?i)\bConnectTimeout\s*=', 'Connect Timeout=')
          $bap = [regex]::Replace([string]$bap, '(?i)\bConnectionTimeout\s*=', 'Connection Timeout=')
          $bap = [regex]::Replace([string]$bap, '(?i)(^|;)\s*Timeout\s*=', '$1Connect Timeout=')
          Write-Output "::add-mask::$bap"

          az webapp config appsettings delete `
            -g $env:AZURE_RESOURCE_GROUP `
            -n $env:WEB_APP `
            --setting-names BAP_SUPPORT_CONNECTION_STRING SQL_BAP_SUPPORT_CONNECTION_STRING SQL_CONNECTION_STRING `
            --only-show-errors | Out-Null

          az webapp config connection-string set `
            -g $env:AZURE_RESOURCE_GROUP `
            -n $env:WEB_APP `
            --connection-string-type SQLServer `
            --settings "BabcoSupportConnectionString=$bap" `
            --only-show-errors | Out-Null

          Write-Host "GLOBAL_BABCO_CONNECTION=connection_string_secret"

      - name: Use current supplied source ZIP only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $current = Join-Path $env:GITHUB_WORKSPACE 'source-package\current-source.b64'
          if(-not (Test-Path $current)){ throw 'Current source package is missing.' }
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'source-package') -Filter 'part*.b64' | Remove-Item -Force
          Copy-Item $current (Join-Path $env:GITHUB_WORKSPACE 'source-package\part01.b64') -Force
          $bytes=[Convert]::FromBase64String((Get-Content $current -Raw).Trim())
          $tmp=Join-Path $env:RUNNER_TEMP 'current-source.zip'
          [IO.File]::WriteAllBytes($tmp,$bytes)
          $sha=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "CURRENT_SOURCE_SHA256=$sha"
          if($sha -ne '99d00cf14da4c30a2b7e787a90e9a4aeb9575136800c64fb1357df9fefd3ac7a'){ throw 'Current source ZIP hash mismatch.' }

      - name: Remove old live App_Code before fresh deployment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $profiles=az webapp deployment list-publishing-profiles -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP -o json | ConvertFrom-Json
          $profile=@($profiles | Where-Object { $_.publishMethod -eq 'MSDeploy' -or $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1)
          if($profile.Count -lt 1){ throw 'Publishing profile unavailable.' }
          $user=[string]$profile[0].userName
          $pass=[string]$profile[0].userPWD
          Write-Output "::add-mask::$user"
          Write-Output "::add-mask::$pass"
          $basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($user+':'+$pass))
          $repair=@'
          $ErrorActionPreference='Continue'
          foreach($dir in @('C:\home\site\wwwroot\App_Code','D:\home\site\wwwroot\App_Code')){
            if(Test-Path $dir){
              try{Remove-Item $dir -Recurse -Force -ErrorAction Stop;Write-Output ('APP_CODE_CLEAN='+$dir+'=removed')}catch{Write-Output ('APP_CODE_CLEAN='+$dir+'=failed:'+($_.Exception.Message -replace '[\r\n]+',' '))}
            }else{Write-Output ('APP_CODE_CLEAN='+$dir+'=not_present')}
          }
          '@
          $encoded=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($repair))
          $body=@{command="powershell -NoProfile -NonInteractive -EncodedCommand $encoded";dir='site\\wwwroot'} | ConvertTo-Json -Compress
          $uri="https://$env:WEB_APP.scm.azurewebsites.net/api/command"
          $result=Invoke-RestMethod -Method Post -Uri $uri -Headers @{Authorization="Basic $basic"} -ContentType 'application/json' -Body $body -TimeoutSec 120
          Write-Host ([string]$result.Output)

      - name: Deploy current source and require live SQL OpenAI Entra health
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy-and-verify.ps1
