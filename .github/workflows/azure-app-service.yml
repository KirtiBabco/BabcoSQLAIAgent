name: Deploy Babco SQL AI Agent to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: babco-sqlagent-production
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  WEB_APP: babco-sqlagent-wf-2c606af4
  GLOBAL_BABCO_SOURCE_APP: app-babco-unloadcompare-0e27b0b7-260814
  GLOBAL_BABCO_CONNECTION_NAME: BabcoSupportConnectionString
  LOGIN_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx
  DEFAULT_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Default.aspx
  EASY_AUTH_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad

jobs:
  deploy-and-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with permanent GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Reuse and normalize global Babco support connection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bap = az webapp config connection-string list `
            -g $env:AZURE_RESOURCE_GROUP `
            -n $env:GLOBAL_BABCO_SOURCE_APP `
            --query "[?name=='$($env:GLOBAL_BABCO_CONNECTION_NAME)'].value | [0]" `
            -o tsv `
            --only-show-errors
          if ([string]::IsNullOrWhiteSpace($bap) -or $bap -eq 'null') {
            throw "Established global BabcoSupportConnectionString was not found on $($env:GLOBAL_BABCO_SOURCE_APP)."
          }
          Write-Output "::add-mask::$bap"
          $bap = [regex]::Replace([string]$bap, '(?i)\bConnectTimeout\s*=', 'Connect Timeout=')
          $bap = [regex]::Replace([string]$bap, '(?i)\bConnectionTimeout\s*=', 'Connection Timeout=')
          $bap = [regex]::Replace([string]$bap, '(?i)(^|;)\s*Timeout\s*=', '$1Connect Timeout=')
          Write-Output "::add-mask::$bap"
          az webapp config appsettings set `
            -g $env:AZURE_RESOURCE_GROUP `
            -n $env:WEB_APP `
            --settings `
              "BAP_SUPPORT_CONNECTION_STRING=$bap" `
              "SQL_BAP_SUPPORT_CONNECTION_STRING=$bap" `
              "SQL_CONNECTION_STRING=$bap" `
            --only-show-errors | Out-Null
          Write-Host "GLOBAL_BABCO_CONNECTION=applied_normalized"

      - name: Remove stale App_Code files before deployment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $profiles=az webapp deployment list-publishing-profiles -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP -o json | ConvertFrom-Json
          $profile=@($profiles | Where-Object { $_.publishMethod -eq 'MSDeploy' -or $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1)
          if($profile.Count -lt 1){ throw 'Publishing profile unavailable.' }
          $user=[string]$profile[0].userName
          $pass=[string]$profile[0].userPWD
          Write-Output "::add-mask::$user"
          Write-Output "::add-mask::$pass"
          $basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($user+':'+$pass))
          $repair=@'
          $ErrorActionPreference='Stop'
          $stale=@('D:\home\site\wwwroot\App_Code\PricingCalculator.cs')
          foreach($f in $stale){
            if(Test-Path $f){ Remove-Item $f -Force; Write-Output ('REMOVED_STALE='+$f) }
          }
          $web='D:\home\site\wwwroot\Web.config'
          if(Test-Path $web){ (Get-Item $web).LastWriteTime=Get-Date }
          '@
          $encoded=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($repair))
          $body=@{command="powershell -NoProfile -NonInteractive -EncodedCommand $encoded";dir='site\\wwwroot'} | ConvertTo-Json -Compress
          $uri="https://$env:WEB_APP.scm.azurewebsites.net/api/command"
          $result=Invoke-RestMethod -Method Post -Uri $uri -Headers @{Authorization="Basic $basic"} -ContentType 'application/json' -Body $body -TimeoutSec 120
          Write-Host ([string]$result.Output)
          az webapp restart -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP --only-show-errors | Out-Null

      - name: Confirm Login compiles before deployment
        shell: pwsh
        run: |
          $code=0
          for($i=1;$i -le 30;$i++){
            try{$r=Invoke-WebRequest -Uri $env:LOGIN_URL -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 20;$code=[int]$r.StatusCode}catch{$code=0}
            if($code -eq 200){break}
            Start-Sleep -Seconds 4
          }
          Write-Host "PREDEPLOY_LOGIN_HTTP=$code"
          if($code -ne 200){throw 'Login did not recover after stale-file cleanup.'}

      - name: Deploy full source and require live SQL OpenAI Entra health
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy-and-verify.ps1
