name: Deploy Babco SQL AI Agent to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  WEB_APP: babco-sqlagent-wf-2c606af4
  LOGIN_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx
  DEFAULT_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Default.aspx
  EASY_AUTH_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct full source and apply production overrides
        id: package
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          try {
            $parts=Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'source-package') -Filter 'part*.b64' | Sort-Object Name
            "PACKAGE_PARTS=$($parts.Count)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
            if($parts.Count -lt 1){throw 'No source package parts found.'}

            $b64=($parts|ForEach-Object{(Get-Content $_.FullName -Raw).Trim()}) -join ''
            $sourceZip=Join-Path $env:RUNNER_TEMP 'source.zip'
            [IO.File]::WriteAllBytes($sourceZip,[Convert]::FromBase64String($b64))
            $hash=(Get-FileHash $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
            "PACKAGE_HASH=$hash"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

            $extract=Join-Path $env:RUNNER_TEMP 'source'
            if(Test-Path $extract){Remove-Item $extract -Recurse -Force}
            Expand-Archive $sourceZip $extract -Force
            $site=Join-Path $extract 'SQL_AI_Agent'
            if(-not(Test-Path $site)){throw 'SQL_AI_Agent source folder is missing.'}

            $overrides=Join-Path $env:GITHUB_WORKSPACE 'deploy-overrides'
            if(-not(Test-Path $overrides)){throw 'deploy-overrides folder is missing.'}
            Get-ChildItem $overrides -Recurse -File|ForEach-Object{
              $relative=$_.FullName.Substring($overrides.Length).TrimStart([char[]]@('\','/'))
              $destination=Join-Path $site $relative
              $parent=Split-Path $destination -Parent
              if(-not(Test-Path $parent)){New-Item -ItemType Directory -Path $parent -Force|Out-Null}
              Copy-Item $_.FullName $destination -Force
            }
            "OVERRIDES_APPLIED=true"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

            foreach($name in @('Login.aspx','Login.aspx.cs','Default.aspx','Default.aspx.cs','Web.config','AuthComplete.aspx.cs','Logout.aspx.cs','App_Code\AppConfig.cs','App_Code\AuthService.cs','App_Code\SqlTool.cs','App_Code\AgentService.cs','App_Code\TelemetryStore.cs')){
              if(-not(Test-Path (Join-Path $site $name))){throw "Missing runtime source file: $name"}
            }

            $login=Get-Content (Join-Path $site 'Login.aspx') -Raw
            $loginCode=Get-Content (Join-Path $site 'Login.aspx.cs') -Raw
            $auth=Get-Content (Join-Path $site 'App_Code\AuthService.cs') -Raw
            $cfg=Get-Content (Join-Path $site 'App_Code\AppConfig.cs') -Raw
            $web=Get-Content (Join-Path $site 'Web.config') -Raw
            $runtime=$login+$loginCode+$auth+$cfg+$web
            if($runtime -match 'Local Test Admin Login|Continue Without Microsoft|btnLocalTest|LOCAL-ADMIN|LocalTestAdminLogin|CanUseLocalTestLogin'){throw 'Local/temporary login bypass is still present.'}
            if($runtime -match 'ENTRA_CLIENT_SECRET|EntraClientSecret'){throw 'Custom Entra client-secret logic is still present.'}
            if($auth -notmatch '/\.auth/login/aad'){throw 'Azure Easy Auth endpoint is missing.'}
            if($login -notmatch 'Sign in with Microsoft Entra ID'){throw 'Microsoft Entra login button is missing.'}
            if($cfg -notmatch 'BAP_SUPPORT_CONNECTION_STRING'){throw 'Global Babco SQL setting is missing from AppConfig.'}
            if($cfg -match 'Password\s*=|User Id\s*=|Server=tcp:'){throw 'A SQL connection value appears embedded in source.'}

            $deployZip=Join-Path $env:RUNNER_TEMP 'site.zip'
            if(Test-Path $deployZip){Remove-Item $deployZip -Force}
            Compress-Archive -Path (Join-Path $site '*') -DestinationPath $deployZip -Force
            "DEPLOY_ZIP=$deployZip"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "PACKAGE_VALID=true"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "SOURCE_LOCAL_ADMIN_REMOVED=true"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "SOURCE_EASY_AUTH=true"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "SOURCE_GLOBAL_SQL=true"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } catch {
            "PACKAGE_ERROR=$($_.Exception.Message.Replace("`r",' ').Replace("`n",' '))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
            throw
          }

      - name: Azure login with GitHub OIDC
        id: oidc
        if: steps.package.outcome == 'success'
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Verify and normalize Azure server-side settings
        id: settings
        if: steps.oidc.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $settings=az webapp config appsettings list -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP | ConvertFrom-Json
          $sql=@($settings|Where-Object{$_.name -eq 'BAP_SUPPORT_CONNECTION_STRING'})
          $openai=@($settings|Where-Object{$_.name -eq 'OPENAI_API_KEY_DEVELOPMENT'})
          $sqlPresent=$sql.Count -gt 0 -and -not [string]::IsNullOrWhiteSpace([string]$sql[0].value)
          $openaiPresent=$openai.Count -gt 0 -and -not [string]::IsNullOrWhiteSpace([string]$openai[0].value)
          "SQL_SETTING_PRESENT=$($sqlPresent.ToString().ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OPENAI_SETTING_PRESENT=$($openaiPresent.ToString().ToLowerInvariant())"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if(-not $sqlPresent){throw 'BAP_SUPPORT_CONNECTION_STRING is missing on Azure App Service.'}
          if(-not $openaiPresent){throw 'OPENAI_API_KEY_DEVELOPMENT is missing on Azure App Service.'}

          $raw=[string]$sql[0].value
          $normalized=[regex]::Replace($raw,'(?i)ConnectTimeout\s*=','Connect Timeout=')
          $normalized=[regex]::Replace($normalized,'(?i)ConnectionTimeout\s*=','Connection Timeout=')
          if($normalized -ne $raw){
            az webapp config appsettings set -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP --settings "BAP_SUPPORT_CONNECTION_STRING=$normalized" --output none
            if($LASTEXITCODE -ne 0){throw 'Could not normalize BAP_SUPPORT_CONNECTION_STRING in Azure.'}
            "SQL_SETTING_NORMALIZED=true"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "SQL_SETTING_NORMALIZED=false"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Deploy ZIP to Azure App Service
        id: deploy
        if: steps.package.outcome == 'success' && steps.oidc.outcome == 'success' && steps.settings.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          az webapp start -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP | Out-Null
          az webapp deploy -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP --src-path $env:DEPLOY_ZIP --type zip --clean true --restart true | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Azure ZIP deployment failed.'}
          az webapp restart -g $env:AZURE_RESOURCE_GROUP -n $env:WEB_APP | Out-Null

      - name: Verify SQL and OpenAI from the live App Service runtime
        id: backend
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 20
          $token=az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv
          Write-Output "::add-mask::$token"

          $script=@'
          $ErrorActionPreference='Continue'
          function OutSafe([string]$k,[object]$v){Write-Output ($k+'='+[string]$v)}
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12

          $cs=[Environment]::GetEnvironmentVariable('BAP_SUPPORT_CONNECTION_STRING')
          OutSafe 'SQL_SETTING_RUNTIME_PRESENT' (-not [string]::IsNullOrWhiteSpace($cs))
          try {
            Add-Type -AssemblyName System.Data
            $cs=[regex]::Replace([string]$cs,'(?i)ConnectTimeout\s*=','Connect Timeout=')
            $cs=[regex]::Replace([string]$cs,'(?i)ConnectionTimeout\s*=','Connection Timeout=')
            $b=New-Object System.Data.SqlClient.SqlConnectionStringBuilder
            $b.ConnectionString=$cs
            $b.ConnectTimeout=10
            $sw=[Diagnostics.Stopwatch]::StartNew()
            $c=New-Object System.Data.SqlClient.SqlConnection($b.ConnectionString)
            $c.Open()
            $cmd=$c.CreateCommand();$cmd.CommandTimeout=10;$cmd.CommandText='SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES'
            $tables=$cmd.ExecuteScalar();$c.Close();$sw.Stop()
            OutSafe 'SQL_OK' 'true';OutSafe 'SQL_TABLE_COUNT' $tables;OutSafe 'SQL_MS' $sw.ElapsedMilliseconds
          } catch {
            OutSafe 'SQL_OK' 'false';OutSafe 'SQL_ERROR_TYPE' $_.Exception.GetType().Name;OutSafe 'SQL_ERROR' ($_.Exception.Message -replace '[\r\n]+',' ')
          }

          $key=[Environment]::GetEnvironmentVariable('OPENAI_API_KEY_DEVELOPMENT')
          if([string]::IsNullOrWhiteSpace($key)){$key=[Environment]::GetEnvironmentVariable('OPENAI_API_KEY')}
          OutSafe 'OPENAI_KEY_RUNTIME_PRESENT' (-not [string]::IsNullOrWhiteSpace($key))
          $model=[Environment]::GetEnvironmentVariable('OPENAI_MODEL');if([string]::IsNullOrWhiteSpace($model)){$model='gpt-5-mini'}
          OutSafe 'OPENAI_MODEL_TESTED' $model
          if(-not [string]::IsNullOrWhiteSpace($key)){
            try {
              $payload=@{model=$model;input='Reply only OK'}|ConvertTo-Json -Compress
              $sw=[Diagnostics.Stopwatch]::StartNew()
              $r=Invoke-WebRequest -Method Post -Uri 'https://api.openai.com/v1/responses' -Headers @{Authorization=('Bearer '+$key)} -ContentType 'application/json' -Body $payload -UseBasicParsing -TimeoutSec 30
              $sw.Stop();OutSafe 'OPENAI_OK' ([int]$r.StatusCode -ge 200 -and [int]$r.StatusCode -lt 300);OutSafe 'OPENAI_HTTP' ([int]$r.StatusCode);OutSafe 'OPENAI_MS' $sw.ElapsedMilliseconds
            } catch {
              $status='';$responseBody=''
              try{$status=[int]$_.Exception.Response.StatusCode}catch{}
              try{$stream=$_.Exception.Response.GetResponseStream();if($stream){$reader=New-Object IO.StreamReader($stream);$responseBody=$reader.ReadToEnd();$reader.Dispose()}}catch{}
              $code='';$message=''
              try{$j=$responseBody|ConvertFrom-Json;$code=[string]$j.error.code;$message=[string]$j.error.message}catch{}
              if($message.Length -gt 500){$message=$message.Substring(0,500)}
              OutSafe 'OPENAI_OK' 'false';OutSafe 'OPENAI_HTTP' $status;OutSafe 'OPENAI_ERROR_CODE' $code;OutSafe 'OPENAI_ERROR_MESSAGE' ($message -replace '[\r\n]+',' ')
            }
          } else {OutSafe 'OPENAI_OK' 'false';OutSafe 'OPENAI_ERROR_MESSAGE' 'No server-side OpenAI API key configured.'}
          '@

          $encoded=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          $requestBody=@{command="powershell -NoProfile -EncodedCommand $encoded";dir='site\\wwwroot'}|ConvertTo-Json -Compress
          $uri="https://$env:WEB_APP.scm.azurewebsites.net/api/command"
          $result=$null
          for($attempt=1;$attempt -le 12;$attempt++){
            try{$result=Invoke-RestMethod -Method Post -Uri $uri -Headers @{Authorization="Bearer $token"} -ContentType 'application/json' -Body $requestBody -TimeoutSec 120;break}catch{Start-Sleep -Seconds 5}
          }
          if($null -eq $result){throw 'Kudu runtime diagnostics endpoint did not become available.'}
          $text=([string]$result.Output)+"`n"+([string]$result.Error)
          $safe=$text -split "`r?`n"|Where-Object{$_ -match '^(SQL_|OPENAI_)'}
          $safe|ForEach-Object{Write-Output $_}
          foreach($line in $safe){
            $p=$line.IndexOf('=');if($p -gt 0){$k=$line.Substring(0,$p);$v=$line.Substring($p+1);"$k=$v"|Out-File $env:GITHUB_ENV -Append -Encoding utf8}
          }
          if(-not($safe -match '^SQL_OK=true$')){throw 'SQL runtime smoke test failed.'}
          if(-not($safe -match '^OPENAI_OK=True$')){throw 'OpenAI runtime smoke test failed.'}

      - name: Verify live Entra-only site
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $login=$null
          for($i=1;$i -le 24;$i++){
            try{$login=Invoke-WebRequest $env:LOGIN_URL -UseBasicParsing -TimeoutSec 30;if([int]$login.StatusCode -eq 200 -and $login.Content -match 'Sign in with Microsoft Entra ID'){break}}catch{}
            Start-Sleep -Seconds 5
          }
          if($null -eq $login -or [int]$login.StatusCode -ne 200){throw 'Login.aspx is not healthy.'}
          if($login.Content -match 'Local Test Admin Login|Continue Without Microsoft|LOCAL-ADMIN'){throw 'Local/temporary login bypass is live.'}

          $easy=0
          try{$r=Invoke-WebRequest $env:EASY_AUTH_URL -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30;$easy=[int]$r.StatusCode}catch{if($_.Exception.Response){$easy=[int]$_.Exception.Response.StatusCode}}
          if($easy -lt 300 -or $easy -ge 400){throw "Easy Auth returned HTTP $easy instead of a Microsoft redirect."}

          $defaultStatus=0
          try{$d=Invoke-WebRequest $env:DEFAULT_URL -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30;$defaultStatus=[int]$d.StatusCode}catch{if($_.Exception.Response){$defaultStatus=[int]$_.Exception.Response.StatusCode}}
          if($defaultStatus -lt 300 -or $defaultStatus -ge 400){throw "Unauthenticated Default.aspx returned HTTP $defaultStatus instead of redirect."}

          "LOGIN_HTTP=200"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LOCAL_ADMIN_REMOVED=true"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "EASY_AUTH_HTTP=$easy"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DEFAULT_UNAUTH_HTTP=$defaultStatus"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VERIFIED_LIVE=true"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish deployment and backend status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          OIDC_RESULT: ${{ steps.oidc.outcome }}
          SETTINGS_RESULT: ${{ steps.settings.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          BACKEND_RESULT: ${{ steps.backend.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'status';if(Test-Path $d){Remove-Item $d -Recurse -Force};New-Item -ItemType Directory -Path $d -Force|Out-Null
          @(
            "SOURCE_COMMIT=$env:GITHUB_SHA","PACKAGE=$env:PACKAGE_RESULT","PACKAGE_VALID=$env:PACKAGE_VALID","PACKAGE_PARTS=$env:PACKAGE_PARTS","PACKAGE_SHA256=$env:PACKAGE_HASH","PACKAGE_ERROR=$env:PACKAGE_ERROR","OVERRIDES_APPLIED=$env:OVERRIDES_APPLIED",
            "SOURCE_LOCAL_ADMIN_REMOVED=$env:SOURCE_LOCAL_ADMIN_REMOVED","SOURCE_EASY_AUTH=$env:SOURCE_EASY_AUTH","SOURCE_GLOBAL_SQL=$env:SOURCE_GLOBAL_SQL","OIDC=$env:OIDC_RESULT","SETTINGS=$env:SETTINGS_RESULT","SQL_SETTING_PRESENT=$env:SQL_SETTING_PRESENT","SQL_SETTING_NORMALIZED=$env:SQL_SETTING_NORMALIZED","OPENAI_SETTING_PRESENT=$env:OPENAI_SETTING_PRESENT",
            "DEPLOY=$env:DEPLOY_RESULT","BACKEND=$env:BACKEND_RESULT","SQL_SETTING_RUNTIME_PRESENT=$env:SQL_SETTING_RUNTIME_PRESENT","SQL_OK=$env:SQL_OK","SQL_TABLE_COUNT=$env:SQL_TABLE_COUNT","SQL_MS=$env:SQL_MS","SQL_ERROR_TYPE=$env:SQL_ERROR_TYPE","SQL_ERROR=$env:SQL_ERROR",
            "OPENAI_KEY_RUNTIME_PRESENT=$env:OPENAI_KEY_RUNTIME_PRESENT","OPENAI_MODEL_TESTED=$env:OPENAI_MODEL_TESTED","OPENAI_OK=$env:OPENAI_OK","OPENAI_HTTP=$env:OPENAI_HTTP","OPENAI_MS=$env:OPENAI_MS","OPENAI_ERROR_CODE=$env:OPENAI_ERROR_CODE","OPENAI_ERROR_MESSAGE=$env:OPENAI_ERROR_MESSAGE",
            "VERIFY=$env:VERIFY_RESULT","LOGIN_HTTP=$env:LOGIN_HTTP","LOCAL_ADMIN_REMOVED=$env:LOCAL_ADMIN_REMOVED","EASY_AUTH_HTTP=$env:EASY_AUTH_HTTP","DEFAULT_UNAUTH_HTTP=$env:DEFAULT_UNAUTH_HTTP","VERIFIED_LIVE=$env:VERIFIED_LIVE","LOGIN_URL=$env:LOGIN_URL","CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))"
          )|Set-Content (Join-Path $d 'status.txt') -Encoding ascii
          Push-Location $d;git init|Out-Null;git checkout -b deployment-status|Out-Null;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add status.txt;git commit -m 'Publish SQL Agent deployment status'|Out-Null;git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git";git push --force origin deployment-status|Out-Null;Pop-Location

      - name: Require full live health
        if: always()
        shell: pwsh
        run: |
          if('${{ steps.package.outcome }}' -ne 'success'){throw 'Source package validation failed.'}
          if('${{ steps.oidc.outcome }}' -ne 'success'){throw 'Azure OIDC login failed.'}
          if('${{ steps.settings.outcome }}' -ne 'success'){throw 'Azure settings validation failed.'}
          if('${{ steps.deploy.outcome }}' -ne 'success'){throw 'Deployment failed.'}
          if('${{ steps.backend.outcome }}' -ne 'success'){throw 'SQL/OpenAI backend health failed.'}
          if('${{ steps.verify.outcome }}' -ne 'success'){throw 'Live authentication verification failed.'}
