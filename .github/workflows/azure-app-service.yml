name: Deploy Babco SQL AI Agent to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  AZURE_RESOURCE_GROUP: rg-babco-rnd-sandbox
  IDENTITY_NAME: id-cbp-7501-gha-rnd
  FEDERATED_CREDENTIAL_NAME: fic-kirti-babcosqlaiagent-main
  OIDC_SUBJECT: repo:KirtiBabco@186008200/BabcoSQLAIAgent@1340622048:ref:refs/heads/main
  WEB_APP: babco-sqlagent-wf-2c606af4
  LOGIN_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx
  DEFAULT_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Default.aspx
  EASY_AUTH_URL: https://babco-sqlagent-wf-2c606af4.azurewebsites.net/.auth/login/aad
  DEVICE_FLOW_CLIENT_ID: 04b07795-8ddb-461a-bbee-02f9e1bf7b46
  DEVICE_PUBLIC_KEY_DER_B64: 

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'sqlagent-stage'
          $zip = Join-Path $env:RUNNER_TEMP 'sqlagent.zip'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','.github','.deployment','deploy.cmd') } | ForEach-Object { Copy-Item $_.FullName $stage -Recurse -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          "DEPLOY_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Try permanent GitHub OIDC login
        id: oidc
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: One-time Owner approval and create permanent federation
        id: bootstrap
        if: steps.oidc.outcome != 'success'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deviceEndpoint = "https://login.microsoftonline.com/$env:AZURE_TENANT_ID/oauth2/v2.0/devicecode"
          $tokenEndpoint = "https://login.microsoftonline.com/$env:AZURE_TENANT_ID/oauth2/v2.0/token"
          $dc = Invoke-RestMethod -Method Post -Uri $deviceEndpoint -ContentType 'application/x-www-form-urlencoded' -Body @{ client_id=$env:DEVICE_FLOW_CLIENT_ID; scope='https://management.azure.com/.default offline_access openid profile' }
          if (-not $dc.device_code -or -not $dc.user_code) { throw 'Device authorization code was not returned.' }
          Write-Output "::add-mask::$($dc.device_code)"
          Write-Output "::add-mask::$($dc.user_code)"

          $rsa=[Security.Cryptography.RSA]::Create(); $read=0
          $rsa.ImportSubjectPublicKeyInfo([Convert]::FromBase64String($env:DEVICE_PUBLIC_KEY_DER_B64),[ref]$read)
          $cipher=$rsa.Encrypt([Text.Encoding]::UTF8.GetBytes([string]$dc.user_code),[Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          $cipherB64=[Convert]::ToBase64String($cipher)
          $statusDir=Join-Path $env:RUNNER_TEMP 'device-v2'; New-Item -ItemType Directory -Path $statusDir -Force|Out-Null
          @('STATE=awaiting_user',"RUN_ID=$env:GITHUB_RUN_ID","VERIFICATION_URI=$($dc.verification_uri)","USER_CODE_CIPHERTEXT_B64=$cipherB64","EXPIRES_IN=$($dc.expires_in)","CREATED_UTC=$([DateTime]::UtcNow.ToString('o'))")|Set-Content (Join-Path $statusDir 'status.txt') -Encoding ascii
          Push-Location $statusDir
          git init|Out-Null; git checkout -b azure-device-auth-v2|Out-Null
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.txt; git commit -m 'Publish encrypted Azure device authorization V2'|Out-Null
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"; git push --force origin azure-device-auth-v2|Out-Null
          Pop-Location

          $accessToken=''; $interval=[Math]::Max([int]$dc.interval,5); $deadline=[DateTime]::UtcNow.AddSeconds([int]$dc.expires_in)
          while([DateTime]::UtcNow -lt $deadline){
            Start-Sleep -Seconds $interval
            try{$tr=Invoke-RestMethod -Method Post -Uri $tokenEndpoint -ContentType 'application/x-www-form-urlencoded' -Body @{grant_type='urn:ietf:params:oauth:grant-type:device_code';client_id=$env:DEVICE_FLOW_CLIENT_ID;device_code=[string]$dc.device_code};if($tr.access_token){$accessToken=[string]$tr.access_token;break}}
            catch{$d=$null;try{$d=$_.ErrorDetails.Message|ConvertFrom-Json}catch{};if($d.error -eq 'authorization_pending'){continue};if($d.error -eq 'slow_down'){$interval+=5;continue};if($d.error -eq 'expired_token'){throw 'Device authorization expired.'};if($d.error -eq 'authorization_declined'){throw 'Device authorization declined.'}}
          }
          if(-not $accessToken){throw 'Device authorization timed out.'}
          Write-Output "::add-mask::$accessToken"
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'arm-token.txt') -Value $accessToken -NoNewline

          $ficUri="https://management.azure.com/subscriptions/$env:AZURE_SUBSCRIPTION_ID/resourceGroups/$env:AZURE_RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities/$env:IDENTITY_NAME/federatedIdentityCredentials/$env:FEDERATED_CREDENTIAL_NAME?api-version=2024-11-30"
          $ficBody=@{properties=@{issuer='https://token.actions.githubusercontent.com';subject=$env:OIDC_SUBJECT;audiences=@('api://AzureADTokenExchange')}}|ConvertTo-Json -Depth 5
          $fic=Invoke-WebRequest -Method Put -Uri $ficUri -Headers @{Authorization="Bearer $accessToken"} -ContentType 'application/json' -Body $ficBody -SkipHttpErrorCheck
          if([int]$fic.StatusCode -lt 200 -or [int]$fic.StatusCode -ge 300){$msg=([string]$fic.Content)-replace '[\r\n]+',' ';throw "FIC create failed HTTP $($fic.StatusCode): $msg"}
          @('STATE=federation_created',"FEDERATED_CREDENTIAL=$env:FEDERATED_CREDENTIAL_NAME","SUBJECT=$env:OIDC_SUBJECT",'AUDIENCE=api://AzureADTokenExchange')|Set-Content (Join-Path $statusDir 'status.txt') -Encoding ascii
          Push-Location $statusDir; git add status.txt; git commit -m 'Record Azure federation V2 creation'|Out-Null; git push --force origin azure-device-auth-v2|Out-Null; Pop-Location

      - name: Resolve ARM token from permanent OIDC
        if: steps.oidc.outcome == 'success'
        shell: pwsh
        run: |
          $token=az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv
          if(-not $token){throw 'ARM token was empty.'}
          Write-Output "::add-mask::$token"; Set-Content -Path (Join-Path $env:RUNNER_TEMP 'arm-token.txt') -Value $token -NoNewline

      - name: Deploy current source directly to Kudu
        id: deploy
        if: steps.oidc.outcome == 'success' || steps.bootstrap.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $token=Get-Content (Join-Path $env:RUNNER_TEMP 'arm-token.txt') -Raw
          $scm="https://$env:WEB_APP.scm.azurewebsites.net/api/zip/site/wwwroot/"
          $r=Invoke-WebRequest -Method Put -Uri $scm -Headers @{Authorization="Bearer $token"} -ContentType 'application/zip' -InFile $env:DEPLOY_ZIP -SkipHttpErrorCheck -TimeoutSec 300
          if([int]$r.StatusCode -lt 200 -or [int]$r.StatusCode -ge 300){throw "Kudu ZIP deploy failed HTTP $($r.StatusCode)."}
          $restart="https://management.azure.com/subscriptions/$env:AZURE_SUBSCRIPTION_ID/resourceGroups/$env:AZURE_RESOURCE_GROUP/providers/Microsoft.Web/sites/$env:WEB_APP/restart?api-version=2023-12-01"
          $rr=Invoke-WebRequest -Method Post -Uri $restart -Headers @{Authorization="Bearer $token"} -SkipHttpErrorCheck
          if([int]$rr.StatusCode -lt 200 -or [int]$rr.StatusCode -ge 300){throw "App restart failed HTTP $($rr.StatusCode)."}
          'DEPLOYED=true'|Set-Content (Join-Path $env:RUNNER_TEMP 'deploy-v2.txt') -Encoding ascii

      - name: Verify live temporary login and Easy Auth
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Start-Sleep -Seconds 20
          $session=New-Object Microsoft.PowerShell.Commands.WebRequestSession; $login=$null
          for($i=1;$i -le 24;$i++){try{$login=Invoke-WebRequest -Uri $env:LOGIN_URL -WebSession $session -UseBasicParsing -TimeoutSec 30;if([int]$login.StatusCode -eq 200 -and $login.Content -match 'Continue Without Microsoft \(Temporary\)' -and $login.Content -match 'Azure App Service Easy Auth'){break}}catch{};Start-Sleep -Seconds 5}
          if($null -eq $login -or [int]$login.StatusCode -ne 200){throw 'Login.aspx did not return 200.'}
          function Hidden([string]$name,[string]$html){$m=[regex]::Match($html,'name="'+[regex]::Escape($name)+'"[^>]*value="([^"]*)"',[Text.RegularExpressions.RegexOptions]::IgnoreCase);if($m.Success){return [Net.WebUtility]::HtmlDecode($m.Groups[1].Value)};return ''}
          $body=@{'__VIEWSTATE'=Hidden '__VIEWSTATE' $login.Content;'__VIEWSTATEGENERATOR'=Hidden '__VIEWSTATEGENERATOR' $login.Content;'__EVENTVALIDATION'=Hidden '__EVENTVALIDATION' $login.Content;'btnTemporary'='Continue Without Microsoft (Temporary)'}
          Invoke-WebRequest -Uri $env:LOGIN_URL -Method Post -Body $body -WebSession $session -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 30|Out-Null
          $default=Invoke-WebRequest -Uri $env:DEFAULT_URL -WebSession $session -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30
          if([int]$default.StatusCode -ne 200 -or $default.Content -notmatch 'Babco SQL AI Agent'){throw 'Temporary session verification failed.'}
          $easy=0;$loc='';try{$e=Invoke-WebRequest -Uri $env:EASY_AUTH_URL -UseBasicParsing -MaximumRedirection 0 -TimeoutSec 30;$easy=[int]$e.StatusCode;$loc=[string]$e.Headers.Location}catch{if($_.Exception.Response){$easy=[int]$_.Exception.Response.StatusCode;try{$loc=[string]$_.Exception.Response.Headers.Location}catch{}}}
          if($easy -lt 300 -or $easy -ge 400){throw "Easy Auth returned HTTP $easy."}
          @('VERIFIED_LIVE=true','LOGIN_HTTP=200','TEMP_BUTTON=true','TEMP_SESSION=true','DEFAULT_HTTP=200',"EASY_AUTH_HTTP=$easy", "EASY_AUTH_LOCATION=$loc", "LOGIN_URL=$env:LOGIN_URL", "DEFAULT_URL=$env:DEFAULT_URL")|Set-Content (Join-Path $env:RUNNER_TEMP 'verify-v2.txt') -Encoding ascii

      - name: Publish deployment status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OIDC_RESULT: ${{ steps.oidc.outcome }}
          BOOTSTRAP_RESULT: ${{ steps.bootstrap.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'v2-status';New-Item -ItemType Directory -Path $dir -Force|Out-Null
          $lines=@("SOURCE_COMMIT=$env:GITHUB_SHA","OIDC=$env:OIDC_RESULT","BOOTSTRAP=$env:BOOTSTRAP_RESULT","DEPLOY=$env:DEPLOY_RESULT","VERIFY=$env:VERIFY_RESULT")
          foreach($f in @('deploy-v2.txt','verify-v2.txt')){$p=Join-Path $env:RUNNER_TEMP $f;if(Test-Path $p){$lines+=Get-Content $p}}
          $lines+="CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))";$lines|Set-Content (Join-Path $dir 'status.txt') -Encoding ascii
          Push-Location $dir;git init|Out-Null;git checkout -b deployment-status|Out-Null;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add status.txt;git commit -m 'Publish SQL Agent deployment status'|Out-Null;git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git";git push --force origin deployment-status|Out-Null;Pop-Location

      - name: Enforce verified live deployment
        if: always()
        shell: pwsh
        run: |
          if('${{ steps.deploy.outcome }}' -ne 'success'){throw 'Deployment failed.'}
          if('${{ steps.verify.outcome }}' -ne 'success'){throw 'Live verification failed.'}
