name: Quick Verify UnloadCompare Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quick-verify-unloadcompare.yml'

permissions:
  contents: read

env:
  APP: 'app-babco-unloadcompare-0e27b0b7-260818'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify root, WebForms page and Entra challenge
        shell: bash
        run: |
          set -euo pipefail

          root="https://$APP.azurewebsites.net/"
          : > "$RUNNER_TEMP/rh"
          rcode=$(curl -sS --max-time 15 --max-redirs 0 -D "$RUNNER_TEMP/rh" -o "$RUNNER_TEMP/rb" -w '%{http_code}' "$root" || true)
          rloc=$(tr -d '\r' < "$RUNNER_TEMP/rh" | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]*:[[:space:]]*/,""); print; exit}')
          echo "ROOT_HTTP=$rcode"
          echo "ROOT_LOCATION=$rloc"
          test "$rcode" = '302'
          printf '%s' "$rloc" | grep -Eq 'UnloadCompare\.aspx|/\.auth/login/aad'

          page="https://$APP.azurewebsites.net/UnloadCompare.aspx"
          : > "$RUNNER_TEMP/ph"
          pcode=$(curl -sS --max-time 15 --max-redirs 0 -D "$RUNNER_TEMP/ph" -o "$RUNNER_TEMP/pb" -w '%{http_code}' "$page" || true)
          ploc=$(tr -d '\r' < "$RUNNER_TEMP/ph" | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]*:[[:space:]]*/,""); print; exit}')
          echo "PAGE_HTTP=$pcode"
          echo "PAGE_LOCATION=$ploc"
          test "$pcode" = '302'
          printf '%s' "$ploc" | grep -Fq '/.auth/login/aad'

          auth="https://$APP.azurewebsites.net/.auth/login/aad?post_login_redirect_uri=%2FUnloadCompare.aspx"
          : > "$RUNNER_TEMP/ah"
          acode=$(curl -sS --max-time 15 --max-redirs 0 -D "$RUNNER_TEMP/ah" -o "$RUNNER_TEMP/ab" -w '%{http_code}' "$auth" || true)
          aloc=$(tr -d '\r' < "$RUNNER_TEMP/ah" | awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]*:[[:space:]]*/,""); print; exit}')
          echo "ENTRA_HTTP=$acode"
          echo "ENTRA_LOCATION=$aloc"
          test "$acode" = '302'
          printf '%s' "$aloc" | grep -Eqi '^https://login\.(windows\.net|microsoftonline\.com)/'

          echo 'ROOT_OK=true'
          echo 'PAGE_OK=true'
          echo 'ENTRA_OK=true'
          echo 'VERIFIED_URL=https://app-babco-unloadcompare-0e27b0b7-260818.azurewebsites.net/'
