name: Remove Stale PricingCalculator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-stale-pricingcalculator.yml'
      - 'ops/run-stale-file-repair.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AZURE_CLIENT_ID: 7a21e1b8-ee78-429e-8051-5dce354e3e1d
  AZURE_TENANT_ID: 7e3bfe8e-acb5-4e0e-9798-c05331d2940c
  AZURE_SUBSCRIPTION_ID: 0e27b0b7-22b9-4e96-8faa-897ca9f09e9c
  RESOURCE_GROUP: rg-babco-rnd-sandbox
  WEB_APP: babco-sqlagent-wf-2c606af4

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Delete stale source file through Kudu
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $profiles=az webapp deployment list-publishing-profiles -g $env:RESOURCE_GROUP -n $env:WEB_APP -o json | ConvertFrom-Json
          $p=@($profiles | Where-Object { $_.publishMethod -eq 'MSDeploy' -or $_.publishMethod -eq 'ZipDeploy' } | Select-Object -First 1)
          if($p.Count -eq 0){throw 'Publishing profile unavailable.'}
          $u=[string]$p[0].userName;$pw=[string]$p[0].userPWD
          Write-Output "::add-mask::$u";Write-Output "::add-mask::$pw"
          $basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($u+':'+$pw))
          $cmd=@'
          $f='D:\home\site\wwwroot\App_Code\PricingCalculator.cs'
          if(Test-Path $f){Remove-Item $f -Force;Write-Output 'STALE_PRICINGCALCULATOR=removed'}else{Write-Output 'STALE_PRICINGCALCULATOR=not_present'}
          '@
          $enc=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($cmd))
          $body=@{command="powershell -NoProfile -EncodedCommand $enc";dir='site\\wwwroot'}|ConvertTo-Json -Compress
          $r=Invoke-RestMethod -Method Post -Uri "https://$env:WEB_APP.scm.azurewebsites.net/api/command" -Headers @{Authorization="Basic $basic"} -ContentType 'application/json' -Body $body -TimeoutSec 120
          Write-Output $r.Output
          az webapp restart -g $env:RESOURCE_GROUP -n $env:WEB_APP --only-show-errors | Out-Null

      - name: Require Login HTTP 200
        shell: pwsh
        run: |
          $url="https://$env:WEB_APP.azurewebsites.net/Login.aspx"
          $code=0
          for($i=1;$i -le 36;$i++){
            try{$r=Invoke-WebRequest -Uri $url -UseBasicParsing -MaximumRedirection 5 -TimeoutSec 20;$code=[int]$r.StatusCode}catch{$code=0}
            if($code -eq 200){break}
            Start-Sleep -Seconds 5
          }
          "LOGIN_HTTP=$code" | Set-Content (Join-Path $env:RUNNER_TEMP 'repair-status.txt') -Encoding ascii
          if($code -ne 200){throw "Login still unhealthy: HTTP $code"}

      - name: Publish repair status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'pub';New-Item -ItemType Directory -Path $d -Force|Out-Null
          $p=Join-Path $env:RUNNER_TEMP 'repair-status.txt'
          if(Test-Path $p){Copy-Item $p (Join-Path $d 'status.txt')}else{'LOGIN_HTTP=0'|Set-Content (Join-Path $d 'status.txt') -Encoding ascii}
          Add-Content (Join-Path $d 'status.txt') "SOURCE_COMMIT=$env:GITHUB_SHA"
          Add-Content (Join-Path $d 'status.txt') "CHECKED_UTC=$([DateTime]::UtcNow.ToString('o'))"
          Push-Location $d;git init|Out-Null;git checkout -b stale-file-repair-status|Out-Null;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add status.txt;git commit -m 'Publish stale file repair status'|Out-Null;git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git";git push --force origin stale-file-repair-status|Out-Null;Pop-Location
