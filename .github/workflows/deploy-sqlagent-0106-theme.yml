name: Deploy SQL Agent 0106 Experience

on:
  push:
    branches: [main]
    paths:
      - 'ops/run-sqlagent-0106-theme.txt'
      - '.github/workflows/deploy-sqlagent-0106-theme.yml'
      - 'deploy-overrides/SqlAgent0106.css'
      - 'deploy-overrides/Default.aspx'
      - 'deploy-overrides/Admin.aspx'
      - 'deploy-overrides/Login.aspx'
      - 'deploy-overrides/Help.aspx'
      - 'deploy-overrides/Standard.aspx'
      - 'deploy-overrides/Diagnostics.aspx'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  RG: 'rg-babco-rnd-sandbox'
  APP: 'babco-sqlagent-wf-2c606af4'
  LOGIN_URL: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx'
  ADMIN_URL: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Admin.aspx'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Validate 0106 experience scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PROTOTYPE' deploy-overrides/Default.aspx
          grep -q 'BABCO LABS' deploy-overrides/Default.aspx
          grep -q 'SqlAgent0106.css' deploy-overrides/Default.aspx
          grep -q 'Diagnostics.aspx' deploy-overrides/Default.aspx
          grep -q 'Cost' deploy-overrides/Admin.aspx
          grep -q 'Outlook / Email and Teams are intentionally not part' deploy-overrides/Help.aspx
          ! grep -q 'data-view="email"' deploy-overrides/Default.aspx
          ! grep -q 'data-view="teams"' deploy-overrides/Default.aspx

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Deploy 0106 theme and pages
        shell: bash
        run: |
          set -euo pipefail
          deploy_one() {
            src="$1"; target="$2"; ok=false
            for i in $(seq 1 10); do
              echo "Deploy $target attempt $i/10"
              if az webapp deploy -g "$RG" -n "$APP" --src-path "$src" --type static --target-path "$target" --restart false --clean false --only-show-errors >/dev/null 2>"$RUNNER_TEMP/deploy.err"; then
                ok=true
                break
              fi
              cat "$RUNNER_TEMP/deploy.err" || true
              sleep 12
            done
            [ "$ok" = true ]
          }
          deploy_one deploy-overrides/SqlAgent0106.css SqlAgent0106.css
          deploy_one deploy-overrides/Login.aspx Login.aspx
          deploy_one deploy-overrides/Default.aspx Default.aspx
          deploy_one deploy-overrides/Admin.aspx Admin.aspx
          deploy_one deploy-overrides/Help.aspx Help.aspx
          deploy_one deploy-overrides/Standard.aspx Standard.aspx
          deploy_one deploy-overrides/Diagnostics.aspx Diagnostics.aspx
          az webapp restart -g "$RG" -n "$APP" --only-show-errors >/dev/null

      - name: Verify live 0106 SQL Agent experience
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/cookies"
          code=0
          for i in $(seq 1 40); do
            code=$(curl -sS -L -c "$RUNNER_TEMP/cookies" -b "$RUNNER_TEMP/cookies" --max-time 25 -o "$RUNNER_TEMP/live.html" -w '%{http_code}' "$LOGIN_URL" || true)
            if [ "$code" = '200' ] && grep -q 'BABCO LABS' "$RUNNER_TEMP/live.html" && grep -q 'SQL AI Agent' "$RUNNER_TEMP/live.html" && grep -q 'Diagnostics.aspx' "$RUNNER_TEMP/live.html" && grep -q 'Ask AI Agent' "$RUNNER_TEMP/live.html"; then break; fi
            sleep 5
          done
          echo "LOGIN_FLOW_HTTP=$code"
          [ "$code" = '200' ]
          grep -q 'PROTOTYPE' "$RUNNER_TEMP/live.html"
          grep -q 'BABCO LABS' "$RUNNER_TEMP/live.html"
          grep -q 'Ask AI Agent' "$RUNNER_TEMP/live.html"
          grep -q 'webkitSpeechRecognition' "$RUNNER_TEMP/live.html"
          grep -q 'speechSynthesis' "$RUNNER_TEMP/live.html"
          ! grep -q '> Outlook<' "$RUNNER_TEMP/live.html"
          ! grep -q '> Teams<' "$RUNNER_TEMP/live.html"

          help=$(curl -sS -b "$RUNNER_TEMP/cookies" --max-time 20 -o "$RUNNER_TEMP/help.html" -w '%{http_code}' "https://$APP.azurewebsites.net/Help.aspx" || true)
          standard=$(curl -sS -b "$RUNNER_TEMP/cookies" --max-time 20 -o "$RUNNER_TEMP/standard.html" -w '%{http_code}' "https://$APP.azurewebsites.net/Standard.aspx" || true)
          diag=$(curl -sS -b "$RUNNER_TEMP/cookies" --max-time 20 -o "$RUNNER_TEMP/diag.html" -w '%{http_code}' "https://$APP.azurewebsites.net/Diagnostics.aspx" || true)
          admin=$(curl -sS -b "$RUNNER_TEMP/cookies" --max-time 20 -o "$RUNNER_TEMP/admin.html" -w '%{http_code}' "$ADMIN_URL" || true)
          echo "HELP_HTTP=$help STANDARD_HTTP=$standard DIAGNOSTICS_HTTP=$diag ADMIN_HTTP=$admin"
          [ "$help" = '200' ]
          [ "$standard" = '200' ]
          [ "$diag" = '200' ]
          [ "$admin" = '200' ]
          grep -q 'AI Usage & Cost' "$RUNNER_TEMP/admin.html"
