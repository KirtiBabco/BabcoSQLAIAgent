name: Deploy SQL Agent 0106 Experience

on:
  push:
    branches: [main]
    paths:
      - 'ops/run-sqlagent-0106-theme.txt'
      - '.github/workflows/deploy-sqlagent-0106-theme.yml'
      - 'deploy-overrides/SqlAgent0106.css'
      - 'deploy-overrides/Default.aspx'
      - 'deploy-overrides/Admin.aspx'
      - 'deploy-overrides/Admin.aspx.cs'
      - 'deploy-overrides/Login.aspx'
      - 'deploy-overrides/Login.aspx.cs'
      - 'deploy-overrides/App_Code/AuthService.cs'
      - 'deploy-overrides/Help.aspx'
      - 'deploy-overrides/Standard.aspx'
      - 'deploy-overrides/Diagnostics.aspx'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: '7a21e1b8-ee78-429e-8051-5dce354e3e1d'
  AZURE_TENANT_ID: '7e3bfe8e-acb5-4e0e-9798-c05331d2940c'
  AZURE_SUBSCRIPTION_ID: '0e27b0b7-22b9-4e96-8faa-897ca9f09e9c'
  RG: 'rg-babco-rnd-sandbox'
  APP: 'babco-sqlagent-wf-2c606af4'
  LOGIN_URL: 'https://babco-sqlagent-wf-2c606af4.azurewebsites.net/Login.aspx'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Validate 0106 experience and Entra scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PROTOTYPE' deploy-overrides/Default.aspx
          grep -q 'BABCO LABS' deploy-overrides/Default.aspx
          grep -q 'SqlAgent0106.css' deploy-overrides/Default.aspx
          grep -q 'Diagnostics.aspx' deploy-overrides/Default.aspx
          grep -q 'Sign in with Microsoft Entra ID' deploy-overrides/Login.aspx
          grep -q '/.auth/login/aad' deploy-overrides/App_Code/AuthService.cs
          grep -q 'BootstrapEasyAuthSession' deploy-overrides/App_Code/AuthService.cs
          ! grep -q 'StartTemporaryAdminSession' deploy-overrides/App_Code/AuthService.cs
          ! grep -q 'Temporary STD Testing Login' deploy-overrides/Login.aspx.cs
          ! grep -q 'data-view="email"' deploy-overrides/Default.aspx
          ! grep -q 'data-view="teams"' deploy-overrides/Default.aspx

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Inspect Easy Auth configuration
        shell: bash
        run: |
          set -u
          enabled=$(az webapp auth show -g "$RG" -n "$APP" --query 'platform.enabled' -o tsv 2>/dev/null || true)
          client=$(az webapp auth show -g "$RG" -n "$APP" --query 'identityProviders.azureActiveDirectory.registration.clientId' -o tsv 2>/dev/null || true)
          echo "EASY_AUTH_CLI_ENABLED=${enabled:-unavailable}"
          if [ -n "$client" ]; then echo 'EASY_AUTH_CLIENT=present'; else echo 'EASY_AUTH_CLIENT=cli-unavailable'; fi
          echo 'Live /.auth/login/aad redirect will be the authoritative Entra verification.'

      - name: Deploy 0106 theme pages and Entra app logic
        shell: bash
        run: |
          set -euo pipefail
          deploy_one() {
            src="$1"; target="$2"; ok=false
            for i in $(seq 1 10); do
              echo "Deploy $target attempt $i/10"
              if az webapp deploy -g "$RG" -n "$APP" --src-path "$src" --type static --target-path "$target" --restart false --clean false --only-show-errors >/dev/null 2>"$RUNNER_TEMP/deploy.err"; then
                ok=true
                break
              fi
              cat "$RUNNER_TEMP/deploy.err" || true
              sleep 12
            done
            [ "$ok" = true ]
          }
          deploy_one deploy-overrides/SqlAgent0106.css SqlAgent0106.css
          deploy_one deploy-overrides/App_Code/AuthService.cs App_Code/AuthService.cs
          deploy_one deploy-overrides/Login.aspx.cs Login.aspx.cs
          deploy_one deploy-overrides/Login.aspx Login.aspx
          deploy_one deploy-overrides/Admin.aspx.cs Admin.aspx.cs
          deploy_one deploy-overrides/Default.aspx Default.aspx
          deploy_one deploy-overrides/Admin.aspx Admin.aspx
          deploy_one deploy-overrides/Help.aspx Help.aspx
          deploy_one deploy-overrides/Standard.aspx Standard.aspx
          deploy_one deploy-overrides/Diagnostics.aspx Diagnostics.aspx
          az webapp restart -g "$RG" -n "$APP" --only-show-errors >/dev/null

      - name: Verify live 0106 theme and Entra entry point
        shell: bash
        run: |
          set -euo pipefail
          code=0
          for i in $(seq 1 40); do
            code=$(curl -sS --max-time 25 -o "$RUNNER_TEMP/login.html" -w '%{http_code}' "$LOGIN_URL" || true)
            if [ "$code" = '200' ] && grep -q 'BABCO LABS' "$RUNNER_TEMP/login.html" && grep -q 'Sign in with Microsoft Entra ID' "$RUNNER_TEMP/login.html"; then break; fi
            sleep 5
          done
          echo "LOGIN_HTTP=$code"
          [ "$code" = '200' ]
          grep -q 'PROTOTYPE' "$RUNNER_TEMP/login.html"
          grep -q 'BABCO LABS' "$RUNNER_TEMP/login.html"
          grep -q 'Sign in with Microsoft Entra ID' "$RUNNER_TEMP/login.html"
          grep -q 'Azure App Service Easy Auth' "$RUNNER_TEMP/login.html"
          ! grep -q 'Temporary STD' "$RUNNER_TEMP/login.html"

          aad=$(curl -sS --max-time 20 -D "$RUNNER_TEMP/aad.headers" -o /dev/null -w '%{http_code}' "https://$APP.azurewebsites.net/.auth/login/aad?post_login_redirect_uri=%2FAuthComplete.aspx" || true)
          echo "ENTRA_ENTRY_HTTP=$aad"
          [ "$aad" = '302' ] || [ "$aad" = '303' ]
          grep -Eqi '^location: .*microsoftonline' "$RUNNER_TEMP/aad.headers"

          css=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/theme.css" -w '%{http_code}' "https://$APP.azurewebsites.net/SqlAgent0106.css" || true)
          echo "THEME_HTTP=$css"
          [ "$css" = '200' ]
          grep -q -- '--orange:#ff7a1a' "$RUNNER_TEMP/theme.css"
